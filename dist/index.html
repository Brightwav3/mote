<title>Make a Mote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;800&family=IBM+Plex+Sans:wght@400;500&display=swap">

<style>
/* Warm beige ground. The neutrals are all pulled the same way off grey —
   a little red, a little more yellow — so the page reads as one paper stock
   rather than as grey with a tint dropped on top. The creature's own colours
   are Bloub's and are left alone. */
:root {
  --bg:     #F2ECE1;
  --fg:     #1D1A15;
  --mut:    #6E665A;
  --faint:  #A79D8C;
  --line:   #DFD6C6;
  --sunk:   #EAE2D4;
  --focus:  #1D1A15;
}
:root[data-theme="dark"] {
  --bg:     #14120F;
  --fg:     #EFEBE3;
  --mut:    #A29A8D;
  --faint:  #6A6357;
  --line:   #2C2823;
  --sunk:   #1D1A16;
  --focus:  #EFEBE3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:     #14120F;
    --fg:     #EFEBE3;
    --mut:    #A29A8D;
    --faint:  #6A6357;
    --line:   #2C2823;
    --sunk:   #1D1A16;
    --focus:  #EFEBE3;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }

/* ══ shared ══════════════════════════════════════════════════════════════ */
.view { min-height: 100dvh; display: none; }
.view.on { display: flex; }

.serif {
  font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
  font-weight: 800;
  letter-spacing: -.035em;
}

/* ══ onboarding ══════════════════════════════════════════════════════════ */
#make {
  flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 24px 56px; gap: 26px;
}
.step-label {
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--faint);
}
#make h1 { margin: 0; font-size: clamp(30px, 6vw, 46px); text-align: center; }

.preview {
  width: min(300px, 62vw); aspect-ratio: 1;
  display: grid; place-items: center;
}
.preview svg { width: 100%; height: 100%; display: block; }

.picker { width: min(560px, 100%); display: flex; flex-direction: column; gap: 18px; }
.picker h2 {
  margin: 0 0 9px; font-size: 12px; font-weight: 500; letter-spacing: .13em;
  text-transform: uppercase; color: var(--faint);
}

.tiles { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
@media (max-width: 520px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
.tiles button {
  aspect-ratio: 1; padding: 7px; background: var(--sunk);
  border: 1.5px solid transparent; border-radius: 11px; cursor: pointer;
  display: grid; place-items: center;
  transition: border-color .14s ease, background .14s ease;
}
.tiles button svg { width: 100%; height: 100%; display: block; }
.tiles button:hover { background: var(--line); }
.tiles button[aria-pressed="true"] { border-color: var(--focus); background: var(--sunk); }
.tiles button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.dots { display: flex; flex-wrap: wrap; gap: 9px; }
.dots button {
  width: 30px; height: 30px; padding: 0; border-radius: 50%;
  border: 1.5px solid var(--line); cursor: pointer;
  transition: transform .13s ease, box-shadow .13s ease;
}
.dots button:hover { transform: scale(1.13); }
.dots button[aria-pressed="true"] {
  transform: scale(1.13);
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--focus);
}
.dots button:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }

#name {
  width: 100%; padding: 11px 14px; font: inherit;
  background: var(--sunk); color: var(--fg);
  border: 1.5px solid var(--line); border-radius: 11px;
}
#name:focus { outline: none; border-color: var(--focus); }
#name::placeholder { color: var(--faint); }

.temper {
  margin: -6px 0 0; color: var(--mut); font-size: 14.5px; text-align: center;
  max-width: 40ch; min-height: 1.5em;
}
.go {
  align-self: center; padding: 13px 32px; border-radius: 999px; cursor: pointer;
  background: var(--fg); color: var(--bg); border: none;
  font-size: 16px; letter-spacing: .01em;
  transition: transform .12s ease, opacity .12s ease;
}
.go:hover { transform: translateY(-1px); }
.go:active { transform: translateY(0); }
.go:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

/* ══ the living page ═════════════════════════════════════════════════════ */
#live { flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 32px 20px 40px; }
#field { width: min(560px, 88vw); aspect-ratio: 1; touch-action: none; }
#field svg { width: 100%; height: 100%; display: block; }
#given { margin: 0; font-size: clamp(22px, 4vw, 30px); }
#mood { margin: 0; color: var(--mut); font-size: 14.5px; min-height: 1.5em; text-align: center; }
#speech {
  margin: 0; min-height: 1.6em; text-align: center; font-size: 17px;
  font-family: Manrope, ui-sans-serif, system-ui, sans-serif; font-weight: 500;
  color: var(--fg); opacity: 0; transition: opacity .3s ease;
}
#speech.on { opacity: 1; }

.acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 560px; margin-top: 6px; }
.acts button {
  padding: 8px 16px; border-radius: 999px; cursor: pointer;
  background: transparent; border: 1.5px solid var(--line);
  font-size: 14.5px; color: var(--mut);
  transition: border-color .14s ease, color .14s ease;
}
.acts button:hover { border-color: var(--focus); color: var(--fg); }
.acts button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* The animation catalogue is folded away by default: it is a thing to go and
   look at, not a control panel he lives inside. */
.show { max-width: 560px; width: 100%; }
.show summary {
  list-style: none; cursor: pointer; text-align: center;
  font-size: 12px; letter-spacing: .13em; text-transform: uppercase;
  color: var(--faint); padding: 6px;
}
.show summary::-webkit-details-marker { display: none; }
.show summary:hover { color: var(--mut); }
.show summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.show .acts { margin-top: 2px; }
.show .acts button { font-size: 13.5px; padding: 6px 13px; }

.change {
  position: fixed; top: 18px; right: 18px; z-index: 2;
  padding: 7px 16px; border-radius: 999px; cursor: pointer;
  background: var(--bg); border: 1.5px solid var(--line);
  font-size: 14px; color: var(--mut);
  transition: border-color .14s ease, color .14s ease;
}
.change:hover { border-color: var(--focus); color: var(--fg); }
.change:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.back {
  background: none; border: none; cursor: pointer; padding: 4px;
  color: var(--faint); font-size: 13.5px; text-decoration: underline;
  text-underline-offset: 3px;
}
.back:hover { color: var(--mut); }
.back[hidden] { display: none; }

@media (prefers-reduced-motion: reduce) {
  #speech, .go, .dots button, .tiles button { transition: none; }
}
</style>

<!-- ══ 1 · make one ══════════════════════════════════════════════════════ -->
<section class="view on" id="make">
  <p class="step-label">One of a kind</p>
  <h1 class="serif">Make a Mote</h1>

  <div class="preview" id="preview"></div>

  <div class="picker">
    <div>
      <h2>Body</h2>
      <div class="tiles" id="shapes"></div>
    </div>
    <div>
      <h2>Colour</h2>
      <div class="dots" id="colours"></div>
    </div>
    <div>
      <h2>Name</h2>
      <input id="name" maxlength="18" placeholder="Mote" autocomplete="off" spellcheck="false">
    </div>
  </div>

  <p class="temper" id="temper"></p>
  <button class="go" id="hatch" type="button">Bring it to life</button>
  <button class="back" id="back" type="button" hidden>Never mind, go back</button>
</section>

<!-- ══ 2 · live with it ══════════════════════════════════════════════════ -->
<section class="view" id="live">
  <button class="change" id="change" type="button">Change</button>
  <div id="field"></div>
  <h1 class="serif" id="given">Mote</h1>
  <p id="mood"></p>
  <p id="speech"></p>
  <div class="acts" id="acts"></div>
  <details class="show">
    <summary>Animations</summary>
    <div class="acts" id="anims"></div>
  </details>
</section>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   MOTE — a small creature you make
   ---------------------------------------------------------------------------
   Four layers, bottom to top:
     1. geometry   two capsules on a sphere; a tangent frame gives volume free
     2. affect     valence/arousal as damped springs with mass
     3. attention  what it wants to look at, and the oculomotor plant that gets
                   the eyes there (saccades, pursuit, drift, tremor, blinks)
     4. drives     boredom, startle, habituation, speech
   Rendering is a pure read of that state each frame; it decides nothing.
   ═══════════════════════════════════════════════════════════════════════════ */

const clamp = (v, lo = 0, hi = 1) => (v < lo ? lo : v > hi ? hi : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const rad   = (d) => (d * Math.PI) / 180;
const rnd   = (a, b) => a + Math.random() * (b - a);
const r2    = (v) => Math.round(v * 100) / 100;
/* Read lazily, not at load. Reading it here used to be the first thing the
   module did, which meant `import Mote from "mote-avatar"` threw in Node —
   Next.js, Remix, Astro, anything that evaluates modules on the server, before
   a line of the integrator's own code ran. A library may not touch the DOM
   until it is asked to do something. ADR 0006:
   docs/decisions/0006-embeddable-agent-avatar.md */
function reducedMotion() {
  return typeof window !== "undefined" && typeof window.matchMedia === "function"
    ? window.matchMedia("(prefers-reduced-motion: reduce)").matches
    : false;
}

/* Deterministic PRNG (mulberry32). Needed because a Mote's character is
   derived from its name: the same name must always produce the same animal. */
function createRng(seed) {
  let x = seed >>> 0;
  return () => {
    x = (x + 0x6d2b79f5) >>> 0;
    let t = Math.imul(x ^ (x >>> 15), 1 | x);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Layered sines with mutually prime periods: drift that never visibly loops. */
function noise(t, period, seed) {
  const p = (t / period) * Math.PI * 2;
  return 0.55 * Math.sin(p + seed) + 0.3 * Math.sin(2 * p + seed * 1.7 + 1.1) + 0.15 * Math.sin(3 * p + seed * 2.3 + 2.4);
}

/* ── 1 · GEOMETRY ─────────────────────────────────────────────────────────
   The eyes move as if painted on a ball, though nothing is shaded. Build the head's
   orthonormal frame, rotate a copy out to each eye's longitude, and project
   orthographically. Foreshortening, tilt and depth-occlusion all fall out of
   that one step. The body stays a flat disc of one colour — all of the volume
   is carried by how the eyes MOVE, never by shading. */

/* Bloub's easing set, used by the animation catalogue. Ported rather than
   re-derived: the measured timings in `anim/states.js` were fitted against
   THESE curves, so a different cubic makes every one of them slightly wrong. */
/* ADR 0005: docs/decisions/0005-animation-catalogue.md */
const EASE = {
  outCubic:   (t) => 1 - Math.pow(1 - t, 3),
  inOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  outQuint:   (t) => 1 - Math.pow(1 - t, 5),
};

function spin(u, v, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return [
    [u[0]*c + v[0]*s, u[1]*c + v[1]*s, u[2]*c + v[2]*s],
    [v[0]*c - u[0]*s, v[1]*c - u[1]*s, v[2]*c - u[2]*s],
  ];
}
/* ADR 0001: after bloub/src/bot/face.ts eyePoses().
   docs/decisions/0001-port-bloub-verbatim.md */
function eyeFrames(yaw, pitch, roll, split, R) {
  let f = [0,0,1], right = [1,0,0], down = [0,1,0];
  [f, right]    = spin(f, right, rad(yaw));
  [down, f]     = spin(down, f, rad(pitch));
  [right, down] = spin(right, down, rad(roll));
  const build = (side) => {
    const [ef, er] = spin(f, right, rad(split * side));
    return { x: ef[0]*R, y: ef[1]*R, a: er[0], b: er[1], c: down[0], d: down[1], depth: ef[2] };
  };
  return [build(-1), build(1)];
}

/* ── 2 · AFFECT ───────────────────────────────────────────────────────────
   Sixteen expressions, each a POINT on the valence/arousal plane rather than
   a state to switch into. The face is always a weighted blend of the three
   nearest, so it is continuous: it spends most of its life between named
   emotions, which is where real faces live too.

   Note what an expression owns: eye SHAPE only (proportions, tilt, lid) plus
   the separation of the two eyes. It does NOT own gaze direction. Baking head
   orientation into an expression is the classic mistake — the eyes then leap
   sideways every time the mood changes, because "sad looks down" fights with
   "you are over there".                                                    */
/* Bloub's expression set entire, per-eye, plus one of my own.

   Three things carried over that the earlier simplification threw away:

     · PER-EYE geometry. `suspicious`, `confused` and `curious` are not mirror
       pairs — one eye is squinted and the other is not, at a different tilt.
       That asymmetry is most of what separates them from a generic squint,
       and averaging them into one shape destroyed it.
     · the `open` channel, which is a lid coming down rather than the eye
       being smaller. `sleepy` needs it; a short eye is not a heavy one.
     · a POSTURAL bias — a head tilt and a raised or lowered gaze belonging to
       the expression. Bloub bakes these into the expression as absolute
       directions; that is what makes eyes leap sideways whenever the mood
       changes. Here they are a small bias ADDED to wherever attention has
       already pointed, so `curious` tilts his head and `proud` lifts his chin
       without either overruling what he is looking at.

   The third axis is DOMINANCE, and it earns its place: on valence/arousal
   alone, `angry` (-0.82, 0.78) and `scared` (-0.62, 0.96) sit almost on top of
   each other and bled into one another constantly, which is why he never
   looked properly furious. They are opposites in control — anger acts, fear
   submits — and separating them on a third axis fixes it. Same for `proud`
   against `shy`, and `suspicious` against `confused`.                       */
/* ── WHERE HE ACTUALLY LOOKS ──────────────────────────────────────────────
   An expression carries its own measured head pose, and Bloub's resting one
   is (yaw 28.49, pitch 28.62, roll -13) — a creature glancing down and to its
   right. That is correct in the original, where the pointer OVERRIDES the
   pose's gaze whenever you move the mouse, so you almost never see it. This
   Mote deliberately does not track the pointer, so the same numbers left it
   permanently looking at the floor.

   So attention wins most of the argument and the expression keeps a fifth of
   it: enough for `proud` to lift its chin and `shy` to duck, not enough to
   decide where he is looking. Roll stays entirely the expression's — a head
   tilt is part of the face, not part of the aim. */
/* ADR 0005: docs/decisions/0005-animation-catalogue.md */
const LOOK_MIX = 0.8;
function gazeOf(pose, aim) {
  return {
    yaw: lerp(pose.yaw, clamp(aim.yaw, -42, 42), LOOK_MIX),
    pitch: lerp(pose.pitch, clamp(aim.pitch, -27, 27), LOOK_MIX),
    roll: pose.roll,
  };
}

const eye = (w, h, tilt = 0, open = 1) => ({ w, h, tilt, open });
const pair = (w, h, tilt = 0, open = 1) => [eye(w, h, tilt, open), eye(w, h, -tilt, open)];

/* ADR 0001: these are Bloub's measured poses, ported verbatim and pinned by
   test/expressions.test.mjs. Do not adjust a value to taste — check it against
   bloub/src/bot/expressions.ts. docs/decisions/0001-port-bloub-verbatim.md */
const FACES = [
  { id: "neutral",     v: 0.00, a: 0.18, d: 0.00, yaw: 28.49, pitch: 28.62, roll: -13, split: 15.46,
    eyes: [eye(0.186, 0.412, 0, 1), eye(0.186, 0.412, 0, 1)] },
  { id: "attentive",   v: 0.15, a: 0.55, d: 0.10, yaw:   4, pitch:   5, roll:  -4, split: 16.00,
    eyes: [eye(0.21, 0.44, 0, 1), eye(0.21, 0.44, -0, 1)] },
  { id: "curious",     v: 0.35, a: 0.60, d: 0.15, yaw:  16, pitch:  -9, roll: -15, split: 16.50,
    eyes: [eye(0.24, 0.46, -8, 1), eye(0.2, 0.38, -8, 1)] },
  { id: "round",       v: 0.34, a: 0.72, d: -0.10, yaw:   5, pitch:  -2, roll:   0, split: 16.60,
    eyes: [eye(0.30, 0.30, 0, 1), eye(0.30, 0.30, 0, 1)] },   // mine, not Bloub's
  { id: "surprised",   v: 0.05, a: 0.88, d: -0.20, yaw:   3, pitch:  -3, roll:   0, split: 19.00,
    eyes: [eye(0.45, 0.47, 0, 1), eye(0.45, 0.47, -0, 1)] },
  { id: "excited",     v: 0.75, a: 0.95, d: 0.50, yaw:   6, pitch: -14, roll:   0, split: 19.50,
    eyes: [eye(0.4, 0.56, -10, 1), eye(0.4, 0.56, 10, 1)] },
  { id: "happy",       v: 0.70, a: 0.50, d: 0.30, yaw:   5, pitch:   9, roll:   0, split: 17.00,
    eyes: [eye(0.27, 0.17, 14, 1), eye(0.27, 0.17, -14, 1)] },
  { id: "laughing",    v: 0.88, a: 0.76, d: 0.50, yaw:   4, pitch:  14, roll:   0, split: 18.00,
    eyes: [eye(0.34, 0.13, 20, 1), eye(0.34, 0.13, -20, 1)] },
  { id: "proud",       v: 0.60, a: 0.40, d: 0.90, yaw:   5, pitch:  17, roll:   0, split: 17.00,
    eyes: [eye(0.3, 0.15, 18, 1), eye(0.3, 0.15, -18, 1)] },
  { id: "shy",         v: 0.28, a: 0.34, d: -0.60, yaw: -19, pitch: -14, roll:  -7, split: 14.00,
    eyes: [eye(0.17, 0.3, 0, 1), eye(0.17, 0.3, -0, 1)] },
  { id: "confused",    v: -0.28, a: 0.55, d: -0.40, yaw: -14, pitch:   3, roll:   8, split: 16.50,
    eyes: [eye(0.2, 0.44, -18, 1), eye(0.28, 0.17, 14, 1)] },
  { id: "suspicious",  v: -0.38, a: 0.45, d: 0.20, yaw:  12, pitch:   6, roll:  -6, split: 16.00,
    eyes: [eye(0.21, 0.4, 0, 1), eye(0.22, 0.15, 0, 1)] },
  { id: "sad",         v: -0.72, a: 0.24, d: -0.50, yaw:   3, pitch: -13, roll:   0, split: 16.00,
    eyes: [eye(0.22, 0.4, -28, 1), eye(0.22, 0.4, 28, 1)] },
  { id: "angry",       v: -0.82, a: 0.78, d: 0.70, yaw:   3, pitch:   7, roll:   0, split: 17.00,
    eyes: [eye(0.34, 0.15, 30, 1), eye(0.34, 0.15, -30, 1)] },
  { id: "scared",      v: -0.62, a: 0.96, d: -0.90, yaw:   2, pitch: -20, roll:   0, split: 20.50,
    eyes: [eye(0.4, 0.6, 0, 1), eye(0.4, 0.6, -0, 1)] },
  { id: "unimpressed", v: -0.20, a: 0.12, d: 0.30, yaw: -22, pitch:   2, roll:   0, split: 16.00,
    eyes: [eye(0.3, 0.12, 0, 1), eye(0.3, 0.12, -0, 1)] },
  { id: "sleepy",      v: 0.05, a: 0.02, d: -0.10, yaw:   6, pitch:  -9, roll:  -3, split: 16.00,
    eyes: [eye(0.2, 0.42, 0, 0.42), eye(0.2, 0.42, -0, 0.42)] },
];

/* Shepard weights over all seventeen. Arousal counts heavier than valence
   because a 0.3 jump in arousal is a much bigger visible change; dominance
   counts a little lighter, since it separates faces rather than driving them.
   eps and the exponent were swept, not guessed: at these values every face
   renders at 97%+ of itself at its own coordinate, and the largest change
   anywhere on the space is small enough to be invisible between frames. An
   earlier version used a cutoff radius and was worse — it left a wide region
   outside every face's support, and crossing that boundary was a visible
   snap. A kernel with no boundary has none of that.                        */
const BLEND_EPS = 0.005;
const BLEND_SHARP = 2.0;

const lerpEye = (x, y, t) => ({
  w: lerp(x.w, y.w, t), h: lerp(x.h, y.h, t),
  tilt: lerp(x.tilt, y.tilt, t), open: lerp(x.open, y.open, t),
});

const poseOf = (f) => ({
  split: f.split, yaw: f.yaw, pitch: f.pitch, roll: f.roll,
  eyes: [{ ...f.eyes[0] }, { ...f.eyes[1] }],
});
const lerpPose = (x, y, t) => ({
  split: lerp(x.split, y.split, t),
  yaw: lerp(x.yaw, y.yaw, t),
  pitch: lerp(x.pitch, y.pitch, t),
  roll: lerp(x.roll, y.roll, t),
  eyes: [lerpEye(x.eyes[0], y.eyes[0], t), lerpEye(x.eyes[1], y.eyes[1], t)],
});

/* ── WHICH FACE, AND GETTING THERE ────────────────────────────────────────
   The face is a DISCRETE choice with a timed crossfade, not a continuous
   weighted blend of the whole set. That is a reversal, and it is worth saying
   why, because the continuous version was defensible and still wrong.

   Weighting every expression by distance meant that whenever the mood sat
   between two faces — which is most of a transition, and a good deal of rest
   — what got drawn was an average of two or three of them. Measured over half
   an hour, 41.5% of his time had no expression above 80%: not `curious`, not
   `happy`, but a 46/44 smear of both, which is a shape nobody drew and which
   reads as approximately nothing. Averaging `angry`'s hard 30-degree squint
   with `curious`'s soft one does not produce an emotion between them; it
   produces mush.

   So the mood plane now decides WHICH of the seventeen he is, and he is that
   one exactly — Bloub's measured pose, unmodified — with a 280ms crossfade
   when he changes his mind. Two guards keep that from flickering: a new face
   has to be meaningfully closer than the one he is already wearing, not just
   marginally, and it has to wait out a minimum dwell. Without both, a mood
   drifting along the boundary between two faces would strobe between them.  */
const CROSSFADE = 0.28;
const DWELL_MIN = 0.34;
const SWITCH_MARGIN = 0.72;   // a rival must be this much closer to win

const worn = {
  face: null, from: null, t0: -9, pose: null,
};

function faceDistance(f, v, a, d) {
  const dv = f.v - v, da = (f.a - a) * 1.55, dd = (f.d - d) * 0.85;
  return dv * dv + da * da + dd * dd;
}

/* ADR 0003: discrete face, timed crossfade — never a weighted blend of poses.
   Stateful and time-ordered; `t` must increase monotonically.
   docs/decisions/0003-discrete-expressions-with-crossfade.md */
function expressionFor(t, v, a, d, forced) {
  let want = FACES[0], best = Infinity;
  if (forced) {
    want = forced; best = -1;
  } else {
    for (const f of FACES) {
      const s = faceDistance(f, v, a, d);
      if (s < best) { best = s; want = f; }
    }
  }

  if (!worn.face) {
    worn.face = want; worn.from = null; worn.t0 = t; worn.pose = poseOf(want);
  } else if (want !== worn.face
             && (forced || best < faceDistance(worn.face, v, a, d) * SWITCH_MARGIN)
             && t - worn.t0 > DWELL_MIN) {
    worn.from = worn.pose;      // crossfade out of exactly what is on screen
    worn.face = want;
    worn.t0 = t;
  }

  const k = clamp((t - worn.t0) / CROSSFADE);
  /* Drop the outgoing pose BEFORE interpolating, not after. Interpolating with
     e === 1 does not return the target exactly — lerp(a, b, 1) is
     a + (b - a) * 1, which for 0.44 -> 0.17 lands on 0.17000000000000004. The
     whole point of the discrete chooser is that a settled face is Bloub's pose
     bit for bit, so the last frame of a crossfade must not be a lerp. */
  if (k >= 1) worn.from = null;
  const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
  worn.pose = worn.from ? lerpPose(worn.from, poseOf(worn.face), e) : poseOf(worn.face);
  return { mix: worn.pose, id: worn.face.id, settled: k >= 1 };
}

function blendFace(v, a, d) {
  const scored = [];
  let total = 0;
  for (const f of FACES) {
    const dv = f.v - v, da = (f.a - a) * 1.55, dd = (f.d - d) * 0.85;
    const w = Math.pow(1 / (dv * dv + da * da + dd * dd + BLEND_EPS), BLEND_SHARP);
    scored.push({ f, w });
    total += w;
  }

  const mix = {
    split: 0, roll: 0, pitch: 0,
    eyes: [eye(0, 0, 0, 0), eye(0, 0, 0, 0)],
  };
  for (const sc of scored) {
    const k = sc.w / total;
    mix.split += sc.f.split * k;
    mix.roll += sc.f.roll * k;
    mix.pitch += sc.f.pitch * k;
    for (let i = 0; i < 2; i++) {
      mix.eyes[i].w += sc.f.eyes[i].w * k;
      mix.eyes[i].h += sc.f.eyes[i].h * k;
      mix.eyes[i].tilt += sc.f.eyes[i].tilt * k;
      mix.eyes[i].open += sc.f.eyes[i].open * k;
    }
  }
  const parts = scored.map((sc) => ({ id: sc.f.id, k: sc.w / total }))
    .sort((x, y) => y.k - x.k).slice(0, 3);
  return { mix, parts };
}

/* Damped spring. Values carry momentum, so mood cannot be assigned — only
   pushed. `k` sets how hard it is pulled home, `c` how much it fights motion. */
class Spring {
  constructor(value, k, c) { this.x = value; this.v = 0; this.home = value; this.k = k; this.c = c; }
  push(impulse) { this.v += impulse; }
  step(dt) {
    /* dt must never be negative. `v *= exp(-c*dt)` is the damping term, and at
       dt < 0 it becomes exp(+something) — an amplifier — so one backwards step
       sends the spring to infinity instead of to rest. A tab being restored or
       the system clock moving is enough to produce that, so the guard is here
       as well as at the call site, and the state is bounded besides. Cheap
       insurance against a creature that explodes once a week. */
    if (!(dt > 0)) return;
    this.v += (this.home - this.x) * this.k * dt;
    this.v *= Math.exp(-this.c * dt);
    this.x = clamp(this.x + this.v * dt, -1.6, 1.6);
    this.v = clamp(this.v, -12, 12);
  }
}

/* A low-pass follower. Anything the body does goes through one of these, so
   no visual property is ever ASSIGNED — only chased. Assigning is what makes
   motion pop; chasing is what makes it read as mass.                       */
class Follow {
  constructor(x, rate) { this.x = x; this.rate = rate; }
  step(dt, target) { this.x += (target - this.x) * clamp(dt * this.rate, 0, 1); return this.x; }
}

/* ── 3 · ATTENTION + OCULOMOTOR PLANT ─────────────────────────────────────
   Gaze does not lerp. Real eyes hold still, then jump. The jump is ballistic
   and its duration scales with the distance travelled — the "main sequence".
   Between jumps the eye is never still either: slow drift plus a fine tremor,
   with a small corrective microsaccade every second or so.

   A large jump also triggers a reflex blink. That is not decoration: a blink
   suppresses vision through the jump, so the blink is what makes a big gaze
   change read as intentional instead of as a glitch.                       */
class Gaze {
  constructor() {
    this.yaw = 0; this.pitch = 0;         // where the eyes actually point
    this.fixYaw = 0; this.fixPitch = 0;   // where they are trying to point
    this.tgtYaw = 0; this.tgtPitch = 0;   // where attention says to point
    this.sac = null;
    this.nextMicro = 0;
    this.lastAmp = 0;
    this.count = 0;
  }
  aim(yaw, pitch) { this.tgtYaw = yaw; this.tgtPitch = pitch; }

  step(t, dt, arousal, onSaccade) {
    if (this.sac) {
      const k = clamp((t - this.sac.t0) / this.sac.dur);
      const e = 1 - Math.pow(1 - k, 2.4);   // fast out, settled arrival
      this.fixYaw   = lerp(this.sac.fy, this.sac.ty, e);
      this.fixPitch = lerp(this.sac.fp, this.sac.tp, e);
      if (k >= 1) this.sac = null;
    } else {
      const dy = this.tgtYaw - this.fixYaw, dp = this.tgtPitch - this.fixPitch;
      const amp = Math.hypot(dy, dp);

      if (amp > 3.2) {
        // Ballistic jump. 24 ms of overhead plus 2.2 ms per degree travelled.
        this.sac = {
          t0: t, dur: 0.024 + 0.0022 * amp,
          fy: this.fixYaw, fp: this.fixPitch,
          ty: this.tgtYaw, tp: this.tgtPitch,
        };
        this.lastAmp = amp; this.count++;
        if (amp > 13) onSaccade(amp);       // big jump → reflex blink
      } else if (amp > 0.05) {
        // Smooth pursuit: the eye can track slow movement without jumping.
        const g = clamp(dt * 7.5, 0, 1);
        this.fixYaw   += dy * g;
        this.fixPitch += dp * g;
      }

      // Microsaccades — the eye refuses to be perfectly still.
      if (t > this.nextMicro) {
        this.nextMicro = t + rnd(0.5, 1.6);
        this.fixYaw   += rnd(-0.55, 0.55);
        this.fixPitch += rnd(-0.4, 0.4);
      }
    }

    // Drift and tremor ride on top of the fixation point, scaled by arousal:
    // a calm creature wanders more, an alert one locks on.
    const wander = reducedMotion() ? 0.35 : lerp(1.25, 0.35, arousal);
    this.yaw   = this.fixYaw   + noise(t, 11.3, 0.4) * 2.2 * wander + noise(t, 0.9, 2.0) * 0.16;
    this.pitch = this.fixPitch + noise(t, 9.1, 1.3) * 1.7 * wander + noise(t, 0.7, 4.1) * 0.13;
  }
}


/* ── BODIES ───────────────────────────────────────────────────────────────
   Ported from Bloub's `shape.ts` / `skins.ts`, function for function, rather
   than reimplemented. My own versions were close in spirit and wrong in every
   particular: 240 samples instead of 64, corners rounded by a p-norm soft
   minimum instead of a Minkowski sum with a disc, capsule and droplet built
   as stacks of overlapping circles instead of the convex hull of two — which
   is what gives them their straight tangent sides — and normalised on area,
   which I invented, instead of on peak radius, which is what the originals do.

   A shape is a radial profile: one radius per angle, all shapes sampled at the
   same angles, so any two correspond point for point.                       */
/* ADR 0001: generators ported from bloub/src/bot/shape.ts and skins.ts, pinned
   by test/shapes.test.mjs. 64 samples, Minkowski corner rounding and peak-radius
   normalisation are load-bearing. docs/decisions/0001-port-bloub-verbatim.md */
const PROFILE_SAMPLES = 64;
const TAU = Math.PI * 2;
const ANGLES = Array.from({ length: PROFILE_SAMPLES }, (_, i) => (i / PROFILE_SAMPLES) * TAU);
const COS = ANGLES.map(Math.cos);
const SIN = ANGLES.map(Math.sin);

/* Any polygon → radial profile, by casting a ray from the centre. */
function profileFromPolygon(poly, cx, cy) {
  const radii = new Array(PROFILE_SAMPLES).fill(0);
  const n = poly.length;
  for (let k = 0; k < PROFILE_SAMPLES; k++) {
    const dx = COS[k], dy = SIN[k];
    let best = 0;
    for (let i = 0; i < n; i++) {
      const a = poly[i], b = poly[(i + 1) % n];
      const ex = b.x - a.x, ey = b.y - a.y;
      const den = dx * ey - dy * ex;
      if (Math.abs(den) < 1e-9) continue;
      const px = a.x - cx, py = a.y - cy;
      const t = (px * ey - py * ex) / den;
      const u = (px * dy - py * dx) / den;
      if (t > best && u >= 0 && u <= 1) best = t;
    }
    radii[k] = best;
  }
  return radii;
}

/* Convex hull of two circles — the common external tangents plus the two
   arcs. This is what makes the capsule a stadium and the droplet a teardrop
   with straight flanks, rather than a lumpy pile of discs. */
function hullOfCircles(x1, y1, r1, x2, y2, r2v, steps = 96) {
  const dx = x2 - x1, dy = y2 - y1;
  const dist = Math.hypot(dx, dy) || 1e-6;
  const base = Math.atan2(dy, dx);
  const spread = Math.acos(Math.max(-1, Math.min(1, (r1 - r2v) / dist)));
  const pts = [];
  for (let i = 0; i <= steps / 2; i++) {
    const a = base + spread + ((TAU - 2 * spread) * i) / (steps / 2);
    pts.push({ x: x1 + Math.cos(a) * r1, y: y1 + Math.sin(a) * r1 });
  }
  for (let i = 0; i <= steps / 2; i++) {
    const a = base - spread + (2 * spread * i) / (steps / 2);
    pts.push({ x: x2 + Math.cos(a) * r2v, y: y2 + Math.sin(a) * r2v });
  }
  return pts;
}

function superellipseProfile(n, sx = 1, sy = 1) {
  return ANGLES.map((_, i) =>
    Math.pow(Math.pow(Math.abs(COS[i] / sx), n) + Math.pow(Math.abs(SIN[i] / sy), n), -1 / n));
}

function unionOfCirclesProfile(circles) {
  const out = new Array(PROFILE_SAMPLES).fill(0);
  for (let i = 0; i < PROFILE_SAMPLES; i++) {
    const dx = COS[i], dy = SIN[i];
    let best = 0;
    for (const c of circles) {
      const b = dx * c.x + dy * c.y;
      const disc = b * b - (c.x * c.x + c.y * c.y - c.r * c.r);
      if (disc < 0) continue;
      const t = b + Math.sqrt(disc);
      if (t > best) best = t;
    }
    out[i] = best;
  }
  return out;
}

/* Corners rounded by Minkowski sum with a disc: every edge is pushed outward
   by `rc` and every vertex becomes an arc of that radius. Vertices are
   therefore placed at the wanted radius MINUS rc. Clockwise, screen axes. */
function roundedPolygon(verts, rc, arcSteps = 10) {
  const n = verts.length;
  const out = [];
  const normal = (a, b) => {
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    return Math.atan2(-dx / len, dy / len);
  };
  for (let i = 0; i < n; i++) {
    const prev = verts[(i - 1 + n) % n], cur = verts[i], next = verts[(i + 1) % n];
    const a0 = normal(prev, cur), a1 = normal(cur, next);
    let d = a1 - a0;
    while (d > Math.PI) d -= TAU;
    while (d < -Math.PI) d += TAU;
    for (let k = 0; k <= arcSteps; k++) {
      const a = a0 + (d * k) / arcSteps;
      out.push({ x: cur.x + Math.cos(a) * rc, y: cur.y + Math.sin(a) * rc });
    }
  }
  return out;
}

function regularPolygonProfile(sides, radius, rc, rotationDeg = 0) {
  const rot = (rotationDeg * Math.PI) / 180;
  const verts = Array.from({ length: sides }, (_, i) => {
    const a = rot + (i / sides) * TAU;
    return { x: Math.cos(a) * (radius - rc), y: Math.sin(a) * (radius - rc) };
  });
  return profileFromPolygon(roundedPolygon(verts, rc), 0, 0);
}

/* Bring the largest radius to `max`, so the shapes weigh the same by eye. */
function normalizeProfile(radii, max = 1) {
  const peak = Math.max(...radii);
  if (peak <= 0) return radii;
  const k = max / peak;
  return radii.map((r) => r * k);
}

/* Pebble: a circle deformed by two low harmonics — irregular but smooth. */
const pebble = normalizeProfile(
  ANGLES.map((a) => 1 + 0.075 * Math.cos(2 * a + 0.5) + 0.035 * Math.cos(3 * a + 2.1)), 1.02);

/* Cloud: a union of bumps, wide at the bottom, two lobes on top. */
const cloud = normalizeProfile(unionOfCirclesProfile([
  { x: -0.44, y: 0.2, r: 0.54 },
  { x: 0.46, y: 0.2, r: 0.5 },
  { x: 0.02, y: 0.3, r: 0.6 },
  { x: -0.24, y: -0.3, r: 0.48 },
  { x: 0.3, y: -0.24, r: 0.44 },
]), 1.02);

/* Droplet: a big disc below, drawn to a point above. */
const droplet = normalizeProfile(
  profileFromPolygon(hullOfCircles(0, 0.28, 0.66, 0, -0.96, 0.05), 0, 0), 1.04);

/* Capsule lying down: the hull of two discs side by side. Not normalised —
   the original leaves it alone. */
const capsule = profileFromPolygon(hullOfCircles(-0.42, 0, 0.62, 0.42, 0, 0.62), 0, 0);

const BODIES = [
  { id: "cercle", label: "Circle", profile: new Array(PROFILE_SAMPLES).fill(1) },
  { id: "galet", label: "Pebble", profile: pebble },
  // 1.15 rather than 1.02: on a superellipse the largest radius is the
  // diagonal, so normalising on it would leave the shape looking smaller
  // than the circle.
  { id: "squircle", label: "Squircle", profile: normalizeProfile(superellipseProfile(4.2), 1.15) },
  { id: "capsule", label: "Capsule", profile: capsule },
  // -90deg: one vertex toward the top of the screen (y points down)
  { id: "triangle", label: "Triangle", profile: regularPolygonProfile(3, 1.12, 0.34, -90) },
  // 0deg: vertices left and right, so the top and bottom edges are flat
  { id: "hexagone", label: "Hexagon", profile: regularPolygonProfile(6, 1.04, 0.26, 0) },
  { id: "nuage", label: "Cloud", profile: cloud },
  { id: "goutte", label: "Droplet", profile: droplet },
];
const BODY_BY_ID = Object.fromEntries(BODIES.map((b) => [b.id, b]));

/* Closed Catmull-Rom through the sampled points, emitted as cubic Béziers.
   Sampling a smooth profile densely and joining with straight lines would be
   fine at this size, but the silhouette is the whole character here — it gets
   curves. */
/* The path is ~9,000 characters and depends only on the silhouette — the
   breath and squash are a scale transform on the group above it, not a
   reshape. So it is built once per body and never again; rebuilding it every
   frame was pure waste. */
const TENSION = 1 / 6;   // Bloub's closedPath tension
const PATH_CACHE = new Map();
function profilePath(body, R) {
  const hit = PATH_CACHE.get(body.id);
  if (hit) return hit;
  const d = buildPath(body.profile, R);
  PATH_CACHE.set(body.id, d);
  return d;
}

function buildPath(profile, R) {
  const pts = profile.map((r, i) => [r * R * COS[i], r * R * SIN[i]]);
  const n = pts.length;
  const at = (i) => pts[(i % n + n) % n];
  let d = `M${r2(pts[0][0])} ${r2(pts[0][1])}`;
  for (let i = 0; i < n; i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    const c1 = [p1[0] + (p2[0] - p0[0]) * TENSION, p1[1] + (p2[1] - p0[1]) * TENSION];
    const c2 = [p2[0] - (p3[0] - p1[0]) * TENSION, p2[1] - (p3[1] - p1[1]) * TENSION];
    d += `C${r2(c1[0])} ${r2(c1[1])},${r2(c2[0])} ${r2(c2[1])},${r2(p2[0])} ${r2(p2[1])}`;
  }
  return d + "Z";
}

/* Bloub's customiser palette, kept as it is: the point of a palette is that
   somebody already balanced it. Eye colour is chosen per body — pale eyes on
   a dark body, dark eyes on a pale one — so cream is a usable body too. */
/* ── SILHOUETTES IN MOTION ────────────────────────────────────────────────
   A profile is a shape; a silhouette is that shape POSED — rotated, squashed
   and offset. The resting body needs none of that, which is why it was not
   here before: it is the animation catalogue that spins a triangle, drops the
   ball to a dot and drags it off-centre.

   `toPoints` and the pose fields are bloub/src/bot/shape.ts verbatim: rotate,
   then squash in screen axes, then translate, then scale. Applying those in
   any other order gives a different shape, not a differently-placed one. */
/* ADR 0005: silhouette posing ported from bloub/src/bot/shape.ts.
   docs/decisions/0005-animation-catalogue.md */
const EGG_PROFILE = [0.8369,0.8424,0.8497,0.8585,0.8674,0.8775,0.8878,0.8983,0.9089,0.9185,0.9288,0.9374,0.9445,0.9504,0.9543,0.9559,0.9555,0.9519,0.9466,0.9389,0.9302,0.9193,0.9085,0.8969,0.8852,0.8734,0.8625,0.8513,0.8411,0.8325,0.8243,0.8179,0.8137,0.8112,0.8102,0.8128,0.8178,0.8262,0.8374,0.8518,0.8702,0.8922,0.9169,0.9446,0.9741,1.0023,1.0267,1.0433,1.0481,1.0393,1.0216,0.9970,0.9697,0.9418,0.9169,0.8949,0.8760,0.8604,0.8490,0.8394,0.8337,0.8314,0.8305,0.8326];

function poseSil(radii, pose) {
  return { radii, rot: 0, cx: 0, cy: 0, sx: 1, sy: 1, ...pose };
}
/* A circle of any radius. Every state that collapses, pops or bounces is this
   one call with a different radius, which is why the morphs never tear: the
   ball and the dot are the same 64 samples. */
function circleSil(radius, pose = {}) {
  return poseSil(new Array(PROFILE_SAMPLES).fill(radius), pose);
}
function bodySil(body, pose = {}) { return poseSil(body.profile, pose); }

function blendSil(a, b, t) {
  const radii = new Array(PROFILE_SAMPLES);
  for (let i = 0; i < PROFILE_SAMPLES; i++) radii[i] = lerp(a.radii[i], b.radii[i], t);
  /* Shortest way round, so a turn from +170deg to -170deg does not unwind the
     whole circle on the way. */
  let dRot = b.rot - a.rot;
  while (dRot > Math.PI) dRot -= TAU;
  while (dRot < -Math.PI) dRot += TAU;
  return {
    radii, rot: a.rot + dRot * t,
    cx: lerp(a.cx, b.cx, t), cy: lerp(a.cy, b.cy, t),
    sx: lerp(a.sx, b.sx, t), sy: lerp(a.sy, b.sy, t),
  };
}

function toPoints(s, scale) {
  const cr = Math.cos(s.rot), sr = Math.sin(s.rot);
  const out = new Array(PROFILE_SAMPLES);
  for (let i = 0; i < PROFILE_SAMPLES; i++) {
    const r = s.radii[i], x = r * COS[i], y = r * SIN[i];
    out[i] = [(( x * cr - y * sr) * s.sx + s.cx) * scale,
              (( x * sr + y * cr) * s.sy + s.cy) * scale];
  }
  return out;
}

/* Same Catmull-Rom as the static bodies, but rebuilt every frame — a posed
   silhouette changes on every one of them, so there is nothing to cache. */
function silPath(s, R) {
  const pts = toPoints(s, R);
  const n = pts.length;
  const at = (i) => pts[(i % n + n) % n];
  let d = `M${r2(pts[0][0])} ${r2(pts[0][1])}`;
  for (let i = 0; i < n; i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    d += `C${r2(p1[0] + (p2[0] - p0[0]) * TENSION)} ${r2(p1[1] + (p2[1] - p0[1]) * TENSION)},` +
         `${r2(p2[0] - (p3[0] - p1[0]) * TENSION)} ${r2(p2[1] - (p3[1] - p1[1]) * TENSION)},` +
         `${r2(p2[0])} ${r2(p2[1])}`;
  }
  return d + "Z";
}

/* Exact closed polyline — keeps straight segments, unlike the Catmull-Rom
   above. The teardrop dot of the leaning "!" is not a disc. */
function polyPath(pts, scale = 1) {
  if (pts.length < 3) return "";
  let d = "";
  for (let i = 0; i < pts.length; i++) {
    d += `${i === 0 ? "M" : "L"}${r2(pts[i].x * scale)} ${r2(pts[i].y * scale)}`;
  }
  return d + "Z";
}

/* Bloub's customiser palette, exactly as published in `skins.ts`, with one
   change: the pale "Cream" (#f1efe9) is pure white here. */
/* ADR 0001: Bloub's customiser palette, unchanged apart from the white.
   docs/decisions/0001-port-bloub-verbatim.md */
const PAINTS = [
  ["Ink", "#0a0a0c"], ["Brown", "#8b5e3c"], ["Red", "#e8483f"],
  ["Orange", "#f08a24"], ["Amber", "#f0b429"], ["Green", "#3ecf8e"],
  ["Turquoise", "#2fbfa0"], ["Blue", "#3b93f0"], ["Violet", "#8b5cf6"],
  ["Pink", "#e152b0"], ["Grey", "#a3a3a3"], ["White", "#ffffff"],
];

/* The eyes are white on every body but the white one, which takes dark ink.
   This is Bloub's own arrangement — a single `--ink` for the whole cast — and
   it is a look, not a contrast optimum: measured, white on Amber is 1.75:1 and
   on Grey 1.93:1, well under the 3:1 that WCAG 1.4.11 asks of a non-text
   graphic. Chosen deliberately over the best-of-two rule that used to live
   here, which kept every paint above 4.5:1 but gave the creature dark eyes on
   half the palette and light eyes on the other half — one animal wearing two
   different faces depending on its colour. `contrastRatio` stays below so the
   cost stays measurable rather than forgotten. */
const WHITE_BODY = "#ffffff";
const INKS = ["#14181A", "#FFFFFF"];

function relLuminance(hex) {
  const n = parseInt(hex.slice(1), 16);
  const lin = (c) => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  return 0.2126 * lin((n >> 16) & 255) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
}

function contrastRatio(a, b) {
  const la = relLuminance(a), lb = relLuminance(b);
  const hi = Math.max(la, lb), lo = Math.min(la, lb);
  return (hi + 0.05) / (lo + 0.05);
}

function eyeInkFor(hex) {
  return hex.toLowerCase() === WHITE_BODY ? INKS[0] : INKS[1];
}

/* ── DECOR ────────────────────────────────────────────────────────────────
   Everything the animations draw that is not the creature: the orbit rings,
   the swoosh, the three thinking dots, the burst particles, the comet ribbons
   and the notification pip.

   Ported from bloub/src/bot/decor.ts, constants included. The seeded tables
   (RINGS, SWOOSH, COMET_RIBBONS, PARTICLES) are generated by the same PRNG
   from the same seeds in the same order, so they come out identical — which is
   the only reason it is safe to keep them as code rather than as data.       */
/* ADR 0005: ported verbatim; the rings and ribbons are seeded tables and the
   draw order is load-bearing. docs/decisions/0005-animation-catalogue.md */

/* The rings are not flat colours: a full hue wheel at constant lightness,
   with a gradient along each stroke. Measured S 45-62%, L 50-67%. */
function wheel(hue, s = 0.55, l = 0.62) {
  const h = ((hue % 360) + 360) % 360;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = l - c / 2;
  const rgb =
    h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x]
      : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
  const hex = (v) => Math.round((v + m) * 255).toString(16).padStart(2, "0");
  return `#${hex(rgb[0])}${hex(rgb[1])}${hex(rgb[2])}`;
}

/* An inclined 3D circle in orthographic projection.

   The z component is not decoration: it splits the stroke in two, and the half
   with z < 0 is drawn BEFORE the body so the body occludes it. That real depth
   sort is what makes the rings read as orbits rather than as a flat doodle. */
function arcRender(seed, t, scale, id, opacity = 1) {
  const spin = seed.phase + t * seed.speed * TAU;
  const cu = Math.cos(seed.tilt), su = Math.sin(seed.tilt);
  const kz = Math.sqrt(Math.max(0, 1 - seed.k * seed.k));

  const N = 64;
  const span = seed.sweep * TAU;
  let front = "", back = "", prev = null;

  for (let i = 0; i <= N; i++) {
    const th = spin + (i / N) * span;
    const ct = Math.cos(th), st = Math.sin(th);
    const x = seed.a * (ct * cu + st * -su * seed.k) + seed.cx;
    const y = seed.a * (ct * su + st * cu * seed.k) + seed.cy;
    const z = seed.a * st * kz;
    const behind = z < 0;
    const cmd = behind !== prev ? "M" : "L";
    if (behind) back += `${cmd}${r2(x * scale)} ${r2(y * scale)}`;
    else front += `${cmd}${r2(x * scale)} ${r2(y * scale)}`;
    prev = behind;
  }

  const gx = cu * seed.a * scale, gy = su * seed.a * scale;
  return {
    id, front, back, width: seed.width * scale, opacity,
    grad: {
      x1: r2(seed.cx * scale - gx), y1: r2(seed.cy * scale - gy),
      x2: r2(seed.cx * scale + gx), y2: r2(seed.cy * scale + gy),
      stops: [wheel(seed.hue), wheel(seed.hue + seed.hueSpan * 0.5), wheel(seed.hue + seed.hueSpan)],
    },
  };
}

const RING_RNG = createRng(0xa11ce);
/* Six rings, semi-major 1.30-1.40 — comfortably larger than the ball —
   flattening always <= 0.45, ~3.3 turns a second. */
const RINGS = Array.from({ length: 6 }, (_, i) => ({
  a: 1.3 + RING_RNG() * 0.1,
  k: 0.05 + RING_RNG() * 0.4,
  tilt: (i / 6) * Math.PI + RING_RNG() * 0.5,
  speed: 3 + RING_RNG() * 0.7,
  phase: RING_RNG() * TAU,
  sweep: 0.6 + RING_RNG() * 0.25,
  hue: (i * 360) / 6 + RING_RNG() * 30,
  hueSpan: 60 + RING_RNG() * 60,
  width: 0.05 + RING_RNG() * 0.012,
  cx: 0, cy: 0.1,
}));

/* Nested arcs sweeping across the triangle, seen almost edge-on. */
const SWOOSH = Array.from({ length: 4 }, (_, i) => ({
  a: 0.78 + i * 0.2, k: 0.05 + i * 0.02, tilt: -0.62 + i * 0.05,
  speed: 0.3, phase: 0.06 * i, sweep: 0.4,
  hue: 95 + i * 62, hueSpan: 100, width: 0.05, cx: 0, cy: -0.12,
}));

/* Three dots: measured x, y = 0. */
const DOT_X = [-0.557, -0.013, 0.532];
const DOT_R = 0.165;
const DOT_PEAK = 1.25;

const P_RNG = createRng(0xbeef);
/* Five particles, one born every 0.2s, life 0.55s. */
const PARTICLES = Array.from({ length: 5 }, (_, i) => ({
  birth: i * 0.2, angle: P_RNG() * TAU, rho: 0.58 + P_RNG() * 0.18,
}));

/* They do not fly straight out: they spiral inward (radius x0.75 a frame,
   angle +100deg/s) while growing, and pass behind the core to be swallowed. */
function particles(t, scale) {
  const out = [];
  for (const p of PARTICLES) {
    const u = t - p.birth;
    if (u < 0 || u > 0.62) continue;
    const rho = p.rho * Math.pow(0.75, u * 10);
    const a = p.angle + (u * 100 * Math.PI) / 180;
    out.push({
      x: Math.cos(a) * rho * scale,
      y: Math.sin(a) * rho * scale,
      r: (0.04 + 0.028 * clamp(u / 0.55)) * scale,
      depth: clamp(1 - rho / 0.8),
      opacity: clamp(u / 0.06) * clamp((0.62 - u) / 0.08),
    });
  }
  return out;
}

/* The comet dot does not cross the screen: it stays put and the trail orbits
   it. Ellipse a 0.85, b 0.15, major axis +34deg, four ribbons, ~210deg/s. */
const COMET_RNG = createRng(0xc0e7);
const COMET_RIBBONS = Array.from({ length: 4 }, (_, i) => {
  const d = i - 1.5;
  return {
    a: 0.85 * (1 + d * 0.03),
    k: (0.15 / 0.85) * (1 + d * 0.16),
    tilt: (34 * Math.PI) / 180 + d * 0.035,
    speed: 210 / 360,
    phase: -i * 0.045 + COMET_RNG() * 0.012,
    sweep: 0.34, hue: i * 85 + COMET_RNG() * 20, hueSpan: 80,
    width: 0.095, cx: 0, cy: 0,
  };
});
const COMET_DOT = 0.129;

/* The notification pip sits exactly on the circumference, at -42deg, and the
   body is notched out concentrically around it with a constant margin. */
const NOTIF_BLUE = "#2496e8";
const NOTIF_ANGLE = -42;
const NOTIF_DIST = 1.003;
const NOTIF_R = 0.15;
const NOTIF_POP = 1.14;
const NOTIF_MARGIN = 0.054;

/* ── THE ANIMATION CATALOGUE ──────────────────────────────────────────────
   Fourteen animations, ported from bloub/src/bot/states.ts with their measured
   constants intact. Each is a pure function of local time: hand it `t` seconds
   since the state began and it returns a complete pose — silhouette, gaze,
   eyes, and whatever decor that state draws. No clock, no state of its own.

   Two flags decide how much of the creature survives an animation:

     · `baseBody` true means the silhouette is the resting body, so the shape
       you picked is the one that plays. False means the shape IS the
       animation — the "!", the dots, the egg, the triangle — and substituting
       a droplet for it would leave nothing to watch.
     · `baseFace` true means the resting expression shows through. Only `idle`
       has it: every other face here was measured off the reference video, and
       reproducing it is the whole point.

   `blinkIn` states hide their entry morph behind a blink, which is how the
   original gets away with changing shape in a single frame.                  */
/* ADR 0005: measured constants, ported not re-derived.
   docs/decisions/0005-animation-catalogue.md */

const REST_GAZE = { yaw: 28.49, pitch: 28.62, roll: -13 };
const EYE_W = 0.186, EYE_H = 0.412, EYE_SPLIT = 15.46;

function baseState(over = {}) {
  return {
    sil: circleSil(1),
    gaze: { ...REST_GAZE },
    split: EYE_SPLIT,
    eyes: pair(EYE_W, EYE_H),
    eyeAlpha: 1,
    dots: [],
    arcs: [],
    notif: null,
    dotsBehind: false,
    ...over,
  };
}

/* The upright "!" bar is not a rectangle: it is the convex hull of a large
   disc at the top and a small one at the bottom, so it tapers (1.76 to 1). */
const BAR_UPRIGHT_CY = -0.1875;
const BAR_UPRIGHT = profileFromPolygon(
  hullOfCircles(0, -0.505, 0.132, 0, 0.13, 0.075), 0, BAR_UPRIGHT_CY);
/* The leaning one is a pure capsule: constant width 0.269, length 0.776. */
const BAR_ITALIC = profileFromPolygon(hullOfCircles(0, -0.2535, 0.1345, 0, 0.2535, 0.1345), 0, 0);

const barUpright = (pose = {}) => poseSil([...BAR_UPRIGHT], { cy: BAR_UPRIGHT_CY, ...pose });
const barItalic = (pose = {}) => poseSil([...BAR_ITALIC], pose);

/* The dot of the leaning "!" is a teardrop, round at the bar end and drawn to
   a point away from it — not a disc. */
const TEAR = polyPath(hullOfCircles(0, 0, 0.118, 0, 0.172, 0.012));

/* The triangle does not spin in place: its centre travels a circle of radius
   0.213 about the origin. That offset is what makes it read as tumbling. */
const TRI_ORBIT = 0.213;
const TRIANGLE = BODY_BY_ID.triangle.profile;
const HEXAGON = BODY_BY_ID.hexagone.profile;

function spinningTriangle(rot) {
  return poseSil(TRIANGLE, {
    rot, cx: -TRI_ORBIT * Math.sin(rot), cy: TRI_ORBIT * Math.cos(rot),
  });
}

/* A pulse travelling left to right across the three dots. */
function dotPulse(t, index) {
  const p = ((((t - index * 0.5) / 1.5) % 1) + 1) % 1;
  const k = p < 0.5 ? 0.5 - 0.5 * Math.cos(p * TAU) : 0;
  return clamp(k * 2);
}

const STATES = [
  {
    id: "idle", label: "Idle", duration: 2.4, morph: 0.45,
    blinkIn: false, baseFace: true, baseBody: true,
    pose: () => baseState(),
  },

  {
    id: "thinking", label: "Thinking", duration: 2.6, morph: 0.4,
    blinkIn: true, baseFace: false, baseBody: false,
    pose: (t) => {
      const mid = dotPulse(t, 1);
      /* The side dots come out of the ball's flanks: in the reference they
         stay fused with it for a frame or two before separating. */
      const emerge = 0.3 + 0.7 * EASE.outCubic(clamp(t / 0.3));
      return baseState({
        // the ball BECOMES the middle dot, so the morph stays continuous
        sil: circleSil(DOT_R * (1 + (DOT_PEAK - 1) * mid), { cx: DOT_X[1] }),
        eyeAlpha: 0,
        dots: [0, 2].map((i) => {
          const k = dotPulse(t, i);
          return {
            x: DOT_X[i] * emerge, y: 0,
            r: DOT_R * (1 + (DOT_PEAK - 1) * k),
            opacity: 0.55 + 0.45 * k,
          };
        }),
      });
    },
  },

  {
    id: "wink", label: "Wink", duration: 1.6, morph: 0.3,
    blinkIn: true, baseFace: false, baseBody: true,
    pose: () => baseState({
      gaze: { yaw: -5.37, pitch: 4.55, roll: 6.7 },
      split: 16.25,
      /* The shut eye is not the open one squashed: it is a horizontal dash
         WIDER than the open eye — 0.447 against 0.236. */
      eyes: [eye(0.236, 0.464), eye(0.447, 0.089)],
    }),
  },

  {
    id: "wide", label: "Wide eyes", duration: 1.8, morph: 0.55,
    blinkIn: true, baseFace: false, baseBody: true,
    pose: () => baseState({
      gaze: { yaw: 6.92, pitch: -21.96, roll: 11.6 },
      split: 18.43, eyes: pair(0.356, 0.875),
    }),
  },

  {
    big: true, id: "alert", label: "Alert", duration: 2.4, minDuration: 2, morph: 0.45,
    blinkIn: false, baseFace: false, baseBody: false,
    pose: (t) => {
      // Measured travel: -0.087 to +0.732 in 1.5s, ease-in-out, micro-overshoot.
      const travel = EASE.inOutCubic(clamp(t / 1.5)) * 0.82 - 0.087;
      const back = t > 1.6 ? clamp((t - 1.6) / 0.4) : 0;
      const x = travel * (1 - back) + 0.1 * back;
      // 2.5Hz secondary buzz, bar and dot in antiphase.
      const buzz = Math.sin(t * 2.5 * TAU) * 0.005;
      const tilt = (17.7 * Math.PI) / 180;
      return baseState({
        sil: barItalic({ rot: tilt, cx: x, cy: -0.325 - buzz }),
        eyeAlpha: 0,
        dots: [{
          x: x - Math.sin(tilt) * 0.58,
          y: -0.325 + Math.cos(tilt) * 0.58 + buzz * 2.8,
          r: 0.118, d: TEAR, rot: (tilt * 180) / Math.PI, opacity: 1,
        }],
      });
    },
  },

  {
    id: "notify", label: "Notification", duration: 2.2, morph: 0.5,
    blinkIn: true, baseFace: false, baseBody: true,
    pose: (t) => {
      // Pop: peaks 14% over at ~0.3s, then settles.
      const p = clamp(t / 0.45);
      const pop = 1 + (NOTIF_POP - 1) * Math.sin(p * Math.PI) * (1 - p * 0.35);
      const r = NOTIF_R * (p < 1 ? pop : 1);
      const a = (NOTIF_ANGLE * Math.PI) / 180;
      return baseState({
        // it looks away from the pip, not at it
        gaze: { yaw: -21.94, pitch: -5.82, roll: -12.2 },
        split: 18.89, eyes: pair(0.505, 0.498),
        notif: { x: Math.cos(a) * NOTIF_DIST, y: Math.sin(a) * NOTIF_DIST, r, notch: r + NOTIF_MARGIN },
      });
    },
  },

  {
    id: "exclaim", label: "Exclamation", duration: 2, morph: 0.45,
    blinkIn: false, baseFace: false, baseBody: false,
    pose: () => baseState({
      sil: barUpright(), eyeAlpha: 0,
      dots: [{ x: -0.012, y: 0.526, r: 0.113, opacity: 1 }],
    }),
  },

  {
    id: "sleep", label: "Sleep", duration: 2.4, morph: 0.5,
    blinkIn: false, baseFace: false, baseBody: false,
    pose: (t) => baseState({
      // Measured bounce: +-0.19 about +0.11, period 0.6s.
      sil: circleSil(0.1585, { cy: 0.11 + Math.sin(t * (TAU / 0.6)) * 0.19 }),
      eyeAlpha: 0,
    }),
  },

  {
    id: "egg", label: "Egg", duration: 1.8, morph: 0.4,
    blinkIn: true, baseFace: false, baseBody: false,
    pose: () => baseState({
      sil: poseSil(EGG_PROFILE),
      gaze: { yaw: 19.97, pitch: 26.01, roll: -17.1 },
      split: 11.07, eyes: pair(0.164, 0.385),   // the eyes narrow with the body
    }),
  },

  {
    id: "hexagon", label: "Hexagon", duration: 1.6, morph: 0.4,
    blinkIn: true, baseFace: false, baseBody: false,
    pose: () => baseState({
      sil: poseSil(HEXAGON),
      gaze: { yaw: 23.11, pitch: 24.42, roll: -13.3 },
      split: 13.37, eyes: pair(0.177, 0.411),
    }),
  },

  {
    big: true, id: "play", label: "Play", duration: 2, morph: 0.5,
    blinkIn: true, baseFace: false, baseBody: false,
    pose: (t) => {
      // The triangle holds nearly still while the bouquet crosses it.
      const fade = clamp(t / 0.35) * clamp((2.2 - t) / 0.5);
      return baseState({
        sil: spinningTriangle(0),
        gaze: { yaw: 12, pitch: -8, roll: -6 },
        split: 15, eyes: pair(0.18, 0.34),
        arcs: SWOOSH.map((s, i) => ({
          id: `sw${i}`, seed: { ...s, cx: 0.45 - t * 0.42 }, t, opacity: fade,
        })),
      });
    },
  },

  {
    big: true, id: "orbit", label: "Orbit", duration: 3.4, minDuration: 2.5, morph: 0.6,
    blinkIn: false, baseFace: false, baseBody: false,
    pose: (t) => {
      // Measured rotation: 0.35s ramp, then 1.25 turns a second, anticlockwise.
      const ramp = EASE.inOutCubic(clamp(t / 0.35));
      const rot = -TAU * 1.25 * t * ramp;
      // The body relaxes out of the triangle and back to the ball mid-orbit.
      const back = EASE.inOutCubic(clamp((t - 1.6) / 0.9));
      const tri = spinningTriangle(rot);
      const ball = circleSil(1, { rot });
      const sil = {
        radii: tri.radii.map((r, i) => r + (ball.radii[i] - r) * back),
        rot, cx: tri.cx * (1 - back), cy: tri.cy * (1 - back), sx: 1, sy: 1,
      };
      const fade = clamp(t / 0.8) * clamp((3.6 - t) / 0.9);
      return baseState({
        sil,
        // the eyes race round the sphere about 3x faster than the silhouette
        gaze: {
          yaw: REST_GAZE.yaw + Math.sin(t * 6.5) * 65 * (1 - back),
          pitch: -4 + back * 32, roll: -13,
        },
        eyes: pair(0.18, 0.34 + back * 0.07),
        arcs: RINGS.map((s, i) => ({
          id: `rg${i}`, seed: s, t, opacity: fade * clamp((t - i * 0.13) / 0.3),
        })),
      });
    },
  },

  {
    big: true, id: "burst", label: "Burst", duration: 2.6, minDuration: 2.4, morph: 0.4,
    blinkIn: false, baseFace: false, baseBody: false,
    pose: (t) => {
      // Measured collapse: 1.0 to 0.166 in 0.7s, ease-out, no bounce.
      const collapse = 1 - 0.834 * EASE.outQuint(clamp(t / 0.7));
      const regrow = EASE.outQuint(clamp((t - 1.7) / 0.7));
      return baseState({
        sil: circleSil(collapse + (1 - collapse) * regrow),
        eyeAlpha: clamp((t - 1.85) / 0.4),
        dots: particles(t, 1), dotsBehind: true,
      });
    },
  },

  {
    big: true, id: "comet", label: "Comet", duration: 2.4, minDuration: 2.4, morph: 0.45,
    blinkIn: false, baseFace: false, baseBody: false,
    pose: (t) => {
      const collapse = 1 - (1 - COMET_DOT) * EASE.outQuint(clamp(t / 0.55));
      const regrow = EASE.outQuint(clamp((t - 1.85) / 0.6));
      const fade = clamp((t - 0.15) / 0.25) * clamp((1.95 - t) / 0.3);
      return baseState({
        // the dot drifts 0.035 down and back up again (measured wobble)
        sil: circleSil(collapse + (1 - collapse) * regrow, {
          cy: Math.sin(clamp(t / 1.7) * Math.PI) * 0.035,
        }),
        eyeAlpha: clamp((t - 2) / 0.35),
        arcs: COMET_RIBBONS.map((s, i) => ({ id: `cm${i}`, seed: s, t, opacity: fade })),
      });
    },
  },
];

const STATE_BY_ID = Object.fromEntries(STATES.map((s) => [s.id, s]));
/* Reading order of the full sequence, as cut in the reference video. */
const SEQUENCE = STATES.map((s) => s.id);

const R = 92;
const VIEWBOX = "-150 -150 300 300";
let stageSeq = 0;

/* One renderer, used for both the live creature and the little previews in
   the picker. A preview is just a frozen Mote, which is why the shape tiles
   look like the thing you are actually choosing.

   Draw order is the whole trick of the animations: the half of an orbit ring
   with z < 0 goes in `arcsBack`, BEFORE the body, so the body occludes it. Put
   every arc in front and the rings stop being orbits and become a doodle. */
/* ADR 0005: the back/front split and the notch mask exist for the animation
   catalogue. docs/decisions/0005-animation-catalogue.md */
const SVG_NS = "http://www.w3.org/2000/svg";
const svgEl = (tag, attrs) => {
  const n = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
};
const add = (parent, tag, attrs) => { const n = svgEl(tag, attrs); parent.appendChild(n); return n; };

/* Built node by node rather than from a markup string. `innerHTML` was shorter
   and it made the render layer impossible to test without a browser: the whole
   thing hung on an HTML parser. With the tree built through `createElementNS`
   and the references kept as they are made, ~40 lines of stub DOM in a test
   are enough to run a real frame. ADR 0006:
   docs/decisions/0006-embeddable-agent-avatar.md */
function makeStage(host, opts = {}) {
  const uid = `s${++stageSeq}`;
  const svg = add(host, "svg", {
    viewBox: VIEWBOX,
    "aria-hidden": opts.decorative ? "true" : "false",
  });

  const defs = add(svg, "defs");
  const mask = add(defs, "mask", {
    id: `${uid}-notch`, maskUnits: "userSpaceOnUse",
    x: "-150", y: "-150", width: "300", height: "300",
  });
  add(mask, "rect", { x: "-150", y: "-150", width: "300", height: "300", fill: "#fff" });
  const notch = add(mask, "circle", { r: "0", fill: "#000" });

  const wrap = add(svg, "g");
  const arcsBack = add(wrap, "g");
  const dotsBack = add(wrap, "g");
  const bodyG = add(wrap, "g", { mask: `url(#${uid}-notch)` });
  const body = add(bodyG, "path");
  const eyes = [0, 1].map(() => {
    const outer = add(wrap, "g");
    const inner = add(outer, "g");
    return { outer, inner, rect: add(inner, "rect", { rx: "9" }) };
  });
  const arcsFront = add(wrap, "g");
  const dotsFront = add(wrap, "g");
  const pip = add(wrap, "circle", { r: "0", fill: NOTIF_BLUE });

  return {
    uid, svg, defs, notch, pip,
    arcsBack, arcsFront, dotsBack, dotsFront,
    wrap, bodyG, body, eyes,
    dotPool: [], arcPool: new Map(),
  };
}

/* Empty an element without `innerHTML`, for the same reason. */
function clearHost(host) {
  while (host.firstChild) host.removeChild(host.firstChild);
}

/* Decor nodes are pooled rather than rebuilt: a state can ask for ten dots on
   one frame and none on the next, and churning the DOM at 60Hz for that is a
   waste of the only budget this page has. */
function dotNode(st, i) {
  if (!st.dotPool[i]) {
    const g = svgEl("path");
    st.dotPool[i] = g;
  }
  return st.dotPool[i];
}

function arcNodes(st, id) {
  let n = st.arcPool.get(id);
  if (!n) {
    const grad = svgEl("linearGradient");
    grad.setAttribute("id", `${st.uid}-${id}`);
    grad.setAttribute("gradientUnits", "userSpaceOnUse");
    const stops = [0, 0.5, 1].map((o) => {
      const s = svgEl("stop");
      s.setAttribute("offset", String(o));
      grad.appendChild(s);
      return s;
    });
    st.defs.appendChild(grad);
    const mk = () => {
      const p = svgEl("path");
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", `url(#${st.uid}-${id})`);
      p.setAttribute("stroke-linecap", "round");
      return p;
    };
    n = { grad, stops, back: mk(), front: mk() };
    st.arcPool.set(id, n);
  }
  return n;
}

/* Draw one frame into a stage. Pure: hand it a pose, it renders that pose and
   decides nothing. The previews call it once; the live view calls it at 60Hz. */
function drawStage(st, pose) {
  /* A posed silhouette changes every frame, so it is rebuilt every frame. A
     resting body does not: writing 9 KB of identical path data sixty times a
     second is the kind of thing that makes a page feel heavy for no gain. */
  if (pose.sil) {
    st.body.setAttribute("d", silPath(pose.sil, R));
    st.shownBody = null;
  } else if (st.shownBody !== pose.body.id) {
    st.body.setAttribute("d", profilePath(pose.body, R));
    st.shownBody = pose.body.id;
  }
  st.body.setAttribute("fill", pose.paint);
  st.wrap.setAttribute("transform", `translate(${r2(pose.x)},${r2(pose.y)})`);

  /* The gaze reaching this point is ABSOLUTE and already composed: the
     expression's own measured head pose, mixed with wherever attention is
     pointing. Rendering decides nothing about where he looks. */
  const frames = eyeFrames(pose.gaze.yaw, pose.gaze.pitch, pose.gaze.roll, pose.split, R);
  const ink = eyeInkFor(pose.paint);
  const alpha = pose.eyeAlpha === undefined ? 1 : pose.eyeAlpha;
  frames.forEach((p, i) => {
    const n = st.eyes[i];
    const e = pose.eyes[i];
    const w = e.w * R, h = e.h * R;
    const lidScale = 0.06 + 0.94 * clamp(e.open * pose.blinkLid);
    n.outer.setAttribute("transform", `translate(${r2(p.x)},${r2(p.y)}) scale(1,${r2(lidScale)})`);
    n.inner.setAttribute("transform",
      `matrix(${r2(p.a)},${r2(p.b)},${r2(p.c)},${r2(p.d)},0,0) rotate(${r2(e.tilt)})`);
    n.rect.setAttribute("x", r2(-w / 2)); n.rect.setAttribute("y", r2(-h / 2));
    n.rect.setAttribute("width", r2(w)); n.rect.setAttribute("height", r2(h));
    n.rect.setAttribute("rx", r2(Math.min(w, h) / 2));
    n.rect.setAttribute("fill", ink);
    n.outer.setAttribute("opacity", r2(clamp((p.depth - 0.02) * 9, 0, 1) * alpha));
  });

  drawDecor(st, pose);
}

function drawDecor(st, pose) {
  const dots = pose.dots || [];
  const arcs = pose.arcs || [];
  const host = pose.dotsBehind ? st.dotsBack : st.dotsFront;

  st.dotPool.forEach((n) => { if (n.parentNode) n.setAttribute("opacity", "0"); });
  dots.forEach((dot, i) => {
    const n = dotNode(st, i);
    if (n.parentNode !== host) host.appendChild(n);
    /* A dot may carry its own outline — the teardrop of the leaning "!" is not
       a disc — in which case `r` is not used for the path at all. */
    if (dot.d) {
      n.setAttribute("d", dot.d);
      n.setAttribute("transform",
        `translate(${r2(dot.x * R)},${r2(dot.y * R)}) rotate(${r2(dot.rot || 0)}) scale(${R})`);
    } else {
      const r = dot.r * R;
      n.setAttribute("d", `M${r2(-r)} 0a${r2(r)} ${r2(r)} 0 1 0 ${r2(r * 2)} 0a${r2(r)} ${r2(r)} 0 1 0 ${r2(-r * 2)} 0Z`);
      n.setAttribute("transform", `translate(${r2(dot.x * R)},${r2(dot.y * R)})`);
    }
    /* Depth haze: the burst particles pass behind the core, and fading them
       toward the page rather than shrinking them is what sells that. */
    n.setAttribute("fill", dot.color || pose.paint);
    n.setAttribute("opacity", r2(dot.opacity * (dot.depth === undefined ? 1 : lerp(0.35, 1, dot.depth))));
  });

  st.arcPool.forEach((n) => { n.back.setAttribute("opacity", "0"); n.front.setAttribute("opacity", "0"); });
  for (const spec of arcs) {
    const a = arcRender(spec.seed, spec.t, R, spec.id, spec.opacity);
    const n = arcNodes(st, spec.id);
    if (n.back.parentNode !== st.arcsBack) st.arcsBack.appendChild(n.back);
    if (n.front.parentNode !== st.arcsFront) st.arcsFront.appendChild(n.front);
    n.grad.setAttribute("x1", a.grad.x1); n.grad.setAttribute("y1", a.grad.y1);
    n.grad.setAttribute("x2", a.grad.x2); n.grad.setAttribute("y2", a.grad.y2);
    a.grad.stops.forEach((c, i) => n.stops[i].setAttribute("stop-color", c));
    n.back.setAttribute("d", a.back); n.front.setAttribute("d", a.front);
    n.back.setAttribute("stroke-width", r2(a.width));
    n.front.setAttribute("stroke-width", r2(a.width));
    n.back.setAttribute("opacity", r2(a.opacity));
    n.front.setAttribute("opacity", r2(a.opacity));
  }

  /* The pip is not drawn on top of the body: the body is notched out around
     it, concentrically, with a constant margin. */
  const nf = pose.notif;
  st.notch.setAttribute("r", nf ? r2(nf.notch * R) : 0);
  if (nf) {
    st.notch.setAttribute("cx", r2(nf.x * R));
    st.notch.setAttribute("cy", r2(nf.y * R));
    st.pip.setAttribute("cx", r2(nf.x * R));
    st.pip.setAttribute("cy", r2(nf.y * R));
  }
  st.pip.setAttribute("r", nf ? r2(nf.r * R) : 0);
}

function seedFrom(text) {
  let h = 0x811c9dc5;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h || 0x9e3779b9;
}

function temperamentFor(name) {
  const rng = createRng(seedFrom(name.toLowerCase().trim() || "mote"));
  const spread = (mid, half) => mid + (rng() * 2 - 1) * half;
  return {
    baseV: spread(0.15, 0.13),      // sunny or grave by default
    baseA: spread(0.52, 0.09),      // lively or placid
    baseD: spread(0.08, 0.18),      // bold or timid
    volatility: spread(1.00, 0.35), // how hard events land
    recovery: spread(1.00, 0.30),   // how fast it lets go of a feeling
    moodGain: spread(1.00, 0.45),   // how much a feeling stains the mood
    curiosity: spread(1.00, 0.40),  // how often something occurs to it
    sociability: spread(1.00, 0.60),// how often it looks over at you
  };
}

/* Two timescales, which is the part the old single-spring model got wrong.

   EMOTION is fast: seconds. It spikes on an event and lets go.
   MOOD is slow: minutes. It integrates whatever the emotion has been doing
   and biases where the emotion returns TO.

   The consequence is a creature with a short memory you can actually feel.
   Praise it three times running and it does not merely flash pleased three
   times and reset — it ends up in a good mood, and stays there a while.
   Scold it and it is subdued for minutes afterwards, so the NEXT thing you do
   lands differently. Nothing on screen reports this; you just notice that it
   has been in a funny mood since you shouted at it.                        */
class Mood {
  constructor() { this.v = 0; this.a = 0; this.d = 0; }

  /* An episode leaves a residue. This is deposited when the feeling FIRES,
     not integrated while it plays out — the first version integrated
     `emotion − home` every frame and could never accumulate anything, because
     the emotion by definition returns to home, so the average was zero. Four
     praises moved the mood by 0.01. Depositing on the event instead ties the
     trace to how far the feeling reached and how novel it was, which is what
     "it took it to heart" actually means. */
  absorb(target, base, temper) {
    const gain = 0.26 * clamp(temper.moodGain, 0.4, 1.8);
    this.v = clamp(this.v + (target.v - base.v) * gain, -0.45, 0.45);
    this.a = clamp(this.a + (target.a - base.a) * gain * 0.6, -0.30, 0.30);
    this.d = clamp(this.d + (target.d - base.d) * gain * 0.7, -0.40, 0.40);
  }

  /* And it fades, over a minute or two, on its own. */
  decay(dt) {
    const k = Math.exp(-dt / 75);
    this.v *= k; this.a *= k; this.d *= k;
  }
}

const mote = {
  valence: new Spring(0.15, 11, 5.2),
  arousal: new Spring(0.53, 10, 5.0),
  dominance: new Spring(0.05, 10, 5.0),
  mood: new Mood(),
  restV: 0.15, restA: 0.53, restD: 0.05,
  temper: temperamentFor("Mote"),
  gaze: new Gaze(),

  body: BODIES[0], paint: PAINTS[0][1], name: "Mote",

  mode: "about", modeUntil: 0,
  place: 0, placeYaw: 0, placePitch: 0,
  glanceYaw: 0, glancePitch: 0, lastGlance: -9,
  nextIdea: 7,

  blinkAt: -9, blinkDur: 0.16, nextBlink: 2,
  speakUntil: -9, thinkUntil: -9,
  hold: null,
  episodeUntil: -9,
  lastInput: 0,
  cursor: { x: 0, y: 0, has: false },
  lastStim: "", lastStimAt: -99,

  awaitingTool: false,

  /* Set by whoever mounts the creature; both default to nothing happening. */
  onSay: null,        // (text, ms) — it said something
  onFace: null,       // (faceId, settled) — the expression it settled into
};

let clock = 0;

/* Put the creature back to its birth state. Every field the running animal
   accumulates is listed here on purpose: this is module-level state, so a
   second `mount` in the same page inherits whatever the first one was feeling
   unless it is cleared. ADR 0006:
   docs/decisions/0006-embeddable-agent-avatar.md */
function resetMote() {
  mote.valence = new Spring(0.15, 11, 5.2);
  mote.arousal = new Spring(0.53, 10, 5.0);
  mote.dominance = new Spring(0.05, 10, 5.0);
  mote.mood = new Mood();
  mote.gaze = new Gaze();
  mote.restV = 0.15; mote.restA = 0.53; mote.restD = 0.05;
  mote.mode = "about"; mote.modeUntil = 0;
  mote.place = 0; mote.placeYaw = 0; mote.placePitch = 0;
  mote.glanceYaw = 0; mote.glancePitch = 0; mote.lastGlance = -9;
  mote.nextIdea = clock + 7;
  mote.blinkAt = -9; mote.blinkDur = 0.16; mote.nextBlink = clock + 2;
  mote.speakUntil = -9; mote.thinkUntil = -9;
  mote.hold = null; mote.episodeUntil = -9;
  mote.lastInput = clock;
  mote.cursor = { x: 0, y: 0, has: false };
  mote.lastStim = ""; mote.lastStimAt = -99;
  mote.awaitingTool = false;
  mote.onSay = null; mote.onFace = null;
  pending.length = 0;
  epoch++;
}

const blink = (t, dur = 0.16) => { mote.blinkAt = t; mote.blinkDur = dur; };

/* Delayed beats run on HIS clock, not the wall clock.

   These used to be wall-clock timers, which is wrong in a way that only shows
   up in real use: `clock` advances only while frames are drawn, so with the
   tab hidden the timer still fires and the second half of a reaction lands on
   a frozen creature — the two beats come apart. On the animation clock the
   whole episode pauses and resumes together. */
/* ADR 0004: creature behaviour is scheduled on the animation clock, never with
   setTimeout — a wall-clock timer fires against a frozen creature when the tab
   is hidden. docs/decisions/0004-scripted-episodes.md */
const pending = [];
let epoch = 0;
const later = (delaySec, fn) => pending.push({ at: clock + delaySec, fn, epoch });
function runPending() {
  for (let i = pending.length - 1; i >= 0; i--) {
    const job = pending[i];
    if (job.epoch !== epoch) { pending.splice(i, 1); continue; }   // superseded
    if (clock >= job.at) { pending.splice(i, 1); job.fn(); }
  }
}

/* ── EPISODES ─────────────────────────────────────────────────────────────
   A reaction is a SCRIPT: a list of faces with a duration each, played in
   order. This replaced ad-hoc timers, which produced sequences nobody wrote.
   Three things went wrong with those and all three are structural:

     · a queued second beat from an earlier idle thought would land in the
       middle of a deliberate reaction and hijack it — you said hello and got
       whatever the creature had been about to do anyway;
     · between two beats there was no hold at all, so the face fell back to
       "nearest expression to the currently travelling mood", which is an
       arbitrary point mid-flight — that is where the stray `méfiant` and
       `curieux` came from;
     · hold durations were scaled by temperament, so the beats drifted out of
       step with the timings they were written against.

   So: starting an episode bumps the epoch, which invalidates every queued
   beat from the last one; each step's hold covers exactly until the next step
   begins, leaving no gap to fall through; and scripted holds are exact, not
   temperament-scaled. What is written below is what plays.                 */
/* ADR 0004: a reaction is a written script; the sequence is the specification.
   docs/decisions/0004-scripted-episodes.md */
function play(steps) {
  epoch++;
  let at = 0;
  for (const st of steps) {
    const run = () => {
      react(st.face, st.hold, {
        exact: true, blink: st.blink, kind: st.kind,
        trace: st.trace === true,
      });
      /* A beat may name an animation from the catalogue, which then plays for
         exactly that beat and then puts itself away. A beat that names none
         leaves a running animation alone — it does NOT cut it. Cutting was
         the first version and it was wrong in the most visible way possible:
         every script the creature plays to itself passes through beats with
         no animation, so any orbit or burst was killed mid-turn by whatever
         it happened to think of next.
         ADR 0005: docs/decisions/0005-animation-catalogue.md */
      if (st.anim) playAnim(st.anim, st.hold);
      if (st.say) say(st.say[0], st.say[1]);
      if (st.look) look(st.look[0], st.look[1]);
      if (st.think) { mote.thinkUntil = clock + st.think; look("inward", st.think); }
    };
    if (at === 0) run(); else later(at, run);
    at += st.hold;
  }
  mote.episodeUntil = clock + at;
}

/* Habituation. The same prod twice running lands at a fraction of the
   strength — the cheapest way to suggest he remembers the last minute. */
function novelty(kind) {
  const gap = clock - mote.lastStimAt;
  const n = kind === mote.lastStim ? clamp(gap / 9, 0.22, 1) : 1;
  mote.lastStim = kind; mote.lastStimAt = clock;
  return n;
}

const FACE_AT = Object.fromEntries(FACES.map((f) => [f.id, f]));

/* Reactions name a FACE and PARK the mood there for a while before letting go.
   Pushing an impulse and letting the spring fly home was the first attempt and
   it never arrived: the mood spiked for 200ms and was back at rest before the
   face finished travelling. The hold is the difference between a twitch and a
   feeling. The body kick lands in two beats — a small counter-move, then the
   reaction proper 130ms later — because without anticipation every reaction
   reads as a jump-cut however smoothly it is interpolated. */
function react(faceId, hold, opts = {}) {
  const f = FACE_AT[faceId];
  const n = (opts.kind ? novelty(opts.kind) : 1) * clamp(mote.temper.volatility, 0.4, 1.6);
  /* `power` went dead when the body kick was removed — it was only ever wired
     to that — so for a while every reaction, subtle or violent, reached its
     face at identical strength. It scales how far the mood actually travels,
     which is what it always meant. */
  const power = opts.power === undefined ? 1 : opts.power;
  const reach = clamp(n * power, 0, 1.15);
  const base = { v: mote.restV, a: mote.restA, d: mote.restD };
  mote.hold = {
    face: f,
    v: lerp(mote.valence.home, f.v, reach),
    a: lerp(mote.arousal.home, f.a, reach),
    d: lerp(mote.dominance.home, f.d, reach),
    until: clock + (opts.exact
      ? hold
      : hold * lerp(0.45, 1, clamp(n)) / clamp(mote.temper.recovery, 0.5, 1.6)),
  };
  /* Only the OPENING beat of an episode leaves a trace. A two-beat reaction —
     pleased, then bashful about being pleased — is one event, and letting the
     second beat deposit as well was quietly cancelling the first: `shy` sits
     below a sunny Mote's resting valence, so being praised made it very
     slightly sadder. Follow-ups pass trace:false. */
  /* Only a step explicitly marked trace:true leaves a mood residue — the
     opening beat of something YOU did. Later beats of the same episode do not
     (one event, one trace), and his own idle scripts never do. */
  if (opts.trace === true) mote.mood.absorb(mote.hold, base, mote.temper);
  if (opts.blink) blink(clock + 0.08, 0.13);
  return n;
}

/* Speech leaves through a callback rather than into an element. The creature
   does not know it is on a page: whoever mounted it decides whether a line
   becomes a bubble, a caption or nothing at all. That is the whole difference
   between a demo and something you can embed. ADR 0006:
   docs/decisions/0006-embeddable-agent-avatar.md */
function say(text, ms) {
  mote.speakUntil = clock + ms / 1000;
  if (mote.onSay) mote.onSay(text, ms);
}

/* Looking at you means looking at WHERE YOU WERE when he decided to look.
   Re-reading the cursor every frame is tracking, however rarely it starts, and
   the eyes glue to the pointer. Snapshot once; hold the fixation. */
function look(mode, seconds) {
  if (mode === "viewer") {
    mote.glanceYaw = clamp(mote.cursor.x, -1, 1) * 30;
    mote.glancePitch = clamp(-mote.cursor.y, -1, 1) * 21;
    mote.lastGlance = clock;
  }
  mote.mode = mode;
  mote.modeUntil = clock + seconds;
}

/* ── his world ────────────────────────────────────────────────────────────
   Eight loci he attends to, in his own order. Real attention is not uniform
   across space: it returns to the same few places and resamples in small
   steps around wherever it already is. Both are here, and together they are
   most of what makes idle behaviour look considered rather than shuffled. */
const PLACES = [
  { y: -32, p: 8 }, { y: 26, p: -5 }, { y: -9, p: 17 }, { y: 43, p: 11 },
  { y: -46, p: -7 }, { y: 7, p: -19 }, { y: 20, p: 22 }, { y: -21, p: -15 },
];

/* Mood weather. His baseline drifts on its own, slowly, which is why he is
   sometimes just in a good mood for no reason you can point at. */
/* Weather is deliberately small. It used to swing wide enough to park his
   resting mood in the gap between attentive, neutral and curious, where the
   blend is a three-way mush and he never looks like anything in particular.
   Resting should land ON a face. */
