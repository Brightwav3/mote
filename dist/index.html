const weather = (t) => ({ v: noise(t, 47, 0.7) * 0.10, a: noise(t, 31, 2.2) * 0.06 });

function pickPlace(near) {
  if (near || Math.random() < 0.42) {
    mote.placeYaw += rnd(-11, 11);
    mote.placePitch += rnd(-7, 7);
  } else {
    mote.place = Math.floor(Math.random() * PLACES.length);
    mote.placeYaw = PLACES[mote.place].y + rnd(-5, 5);
    mote.placePitch = PLACES[mote.place].p + rnd(-4, 4);
  }
  mote.placeYaw = clamp(mote.placeYaw, -48, 48);
  mote.placePitch = clamp(mote.placePitch, -24, 26);
}

/* Things that occur to him, unprompted.

   The first version of this list named six faces, and a measurement over half
   an hour of him alone found the obvious consequence: eight of the seventeen
   NEVER appeared. He cannot be delighted, cross, bashful or frightened by
   himself if nothing in here ever makes him so, and a creature that only ever
   cycles attentive → curious → neutral is a screensaver.

   So: every face is reachable from his own head, and several arrive as short
   chains, because that is how they actually happen. Nobody goes straight to
   laughing — you notice something first. Nobody is proud without being
   pleased first. Fright arrives before you know what frightened you and
   resolves into puzzlement a second later.

   Weights are deliberately lopsided. He is mostly pottering about; the vivid
   ones are rare enough to be worth catching. And every one of these passes
   trace:false — his own musings must not stain his mood, or he would drift
   somewhere random over an afternoon of being left alone. Only things YOU do
   are worth remembering.                                                    */
/* His own thoughts, as scripts. Weights are lopsided on purpose: he is mostly
   pottering about, and the vivid ones stay rare enough to be worth catching.
   None of them carry a mood trace — his own musings must not stain how he
   feels, or an afternoon alone would leave him somewhere random. Only things
   YOU do are worth remembering. */
const IDEAS = [
  [16, [{ face: "neutral", hold: 2.4 }]],
  [14, [{ face: "attentive", hold: 2.6 }]],
  [14, [{ face: "curious", hold: 2.8 }]],
  [9, [{ face: "round", hold: 2.6 }]],
  [9, [{ face: "happy", hold: 2.6 }]],
  [8, [{ face: "unimpressed", hold: 3.0 }]],
  [5, [{ face: "surprised", hold: 1.4, blink: true }, { face: "attentive", hold: 2.0 }]],
  [5, [{ face: "sleepy", hold: 3.4 }]],
  [4, [{ face: "confused", hold: 2.6 }]],
  [4, [{ face: "happy", hold: 1.2 }, { face: "proud", hold: 2.8 }]],
  [3, [{ face: "curious", hold: 1.0 }, { face: "laughing", hold: 2.4 }]],
  [3, [{ face: "happy", hold: 1.0 }, { face: "shy", hold: 2.6 }]],
  [3, [{ face: "round", hold: 1.0 }, { face: "excited", hold: 2.4 }]],
  [3, [{ face: "suspicious", hold: 2.6 }]],
  [2, [{ face: "unimpressed", hold: 1.0 }, { face: "sad", hold: 2.8 }]],
  [2, [{ face: "suspicious", hold: 0.9 }, { face: "angry", hold: 2.4 }]],
  [1, [{ face: "surprised", hold: 0.7, blink: true }, { face: "scared", hold: 2.0 }]],
  [4, [{ face: "neutral", hold: 2.6, think: 2.4 }]],
  [2, [{ face: "curious", hold: 2.0, look: ["viewer", 1.1] }]],
];

function idea() {
  let r = Math.random() * IDEAS.reduce((n, [w]) => n + w, 0);
  for (const [w, steps] of IDEAS) {
    if ((r -= w) <= 0) {
      play(steps);
      pickPlace(Math.random() < 0.6);
      return;
    }
  }
}

function direct(t) {
  const idle = t - mote.lastInput;
  const w = weather(t);

  /* Where the emotion returns to = who he is + what sort of minute he has
     been having + slow weather. Only the first is fixed. */
  const T = mote.temper;
  const settle = (v, a, d) => {
    /* Remembered separately from `.home`, because `.home` is commandeered by
       whatever reaction is running; the residue has to be measured against
       where he would be if nothing were happening. */
    mote.restV = clamp(v + mote.mood.v, -1, 1);
    mote.restA = clamp(a + mote.mood.a, 0, 1);
    mote.restD = clamp(d + mote.mood.d, -1, 1);
    mote.valence.home = mote.restV;
    mote.arousal.home = mote.restA;
    mote.dominance.home = mote.restD;
  };

  if (mote.mode !== "asleep" && idle > 52) {
    mote.mode = "asleep"; mote.modeUntil = t + 999;
    settle(0.05, 0.02, -0.1);
  } else if (mote.mode === "asleep") {
    settle(0.05, 0.02, -0.1);
  } else if (idle > 30) {
    settle(T.baseV - 0.29 + w.v * 0.5, T.baseA - 0.37 + w.a * 0.4, T.baseD + 0.15);
  } else {
    settle(T.baseV + w.v, T.baseA + w.a, T.baseD);
  }

  if (t > mote.nextIdea && mote.mode !== "asleep" && t > mote.episodeUntil) {
    mote.nextIdea = t + rnd(1.8, 4.6) / clamp(mote.temper.curiosity, 0.5, 1.8);
    /* Not while something is playing: an idea that lands mid-animation used to
       interrupt it, and the creature has nothing to say that is worth cutting
       an orbit in half for. */
    if (!animBusy() && (!mote.hold || t > mote.hold.until)) idea();
  }

  if (t > mote.modeUntil && mote.mode !== "asleep") {
    if (Math.random() < 0.04 * clamp(mote.temper.sociability, 0.2, 2.2) && mote.cursor.has && t - mote.lastGlance > 9) look("viewer", rnd(0.6, 1.3));
    else { pickPlace(false); look("about", rnd(0.9, 3.4)); }
  }

  if (mote.mode === "viewer") { mote.gaze.aim(mote.glanceYaw, mote.glancePitch); return; }
  if (mote.mode === "inward") {
    mote.gaze.aim(noise(t, 2.1, 1.4) * 22 - 6, -12 + noise(t, 1.6, 3.3) * 7);
    return;
  }
  if (mote.mode === "away") { mote.gaze.aim(-30, 13); return; }
  if (mote.mode === "asleep") { mote.gaze.aim(4, -15); return; }
  mote.gaze.aim(mote.placeYaw, mote.placePitch);
}

/* ── how he is, in words ──────────────────────────────────────────────────
   The only status worth showing. Not numbers — a sentence, in his own terms,
   and only when it has changed. */
const MOODLINE = {
  round: "wide-eyed about something", neutral: "somewhere else entirely",
  attentive: "taking it all in", curious: "curious about something",
  surprised: "caught off guard", excited: "thoroughly excited",
  happy: "quietly pleased", laughing: "delighted with itself",
  proud: "rather pleased with itself", shy: "a little bashful",
  confused: "not following", suspicious: "not sure it believes you",
  sad: "a bit downcast", angry: "distinctly unimpressed with you",
  scared: "alarmed", unimpressed: "bored", sleepy: "nearly asleep",
};

/* ── the frame ────────────────────────────────────────────────────────────
   Every body channel is a spring or a follower, so none of them can step.
   Assigning a visual property is what makes motion pop; chasing one is what
   makes it read as mass. */
/* ── PLAYING AN ANIMATION ─────────────────────────────────────────────────
   The catalogue in `states.js` is pure: a state is a function of local time.
   This is the part that owns a clock — which state is running, which one it is
   coming FROM, and how the two are mixed.

   The mix is one scalar and one rule: **everything on screen is a crossfade
   between an outgoing pose and an incoming one.** Ordinary life — the body you
   picked, wearing the expression the mood chose — is just another pose, so
   starting an animation, switching between two, and stopping are all the same
   operation with different ends.

   That is the second design here. The first blended each state against
   ordinary life and nothing else, which meant every switch went *through* the
   resting ball: `thinking` collapses the body to a dot on the right-hand side
   and `notify` wants the full ball, so going from one to the other popped the
   ball back to full size and then reformed it. Worse, starting a state while
   another was showing reset the ramp, so the drawn pose snapped to rest in a
   single frame before morphing in. There was no path between two states,
   because nothing held on to the one being left.

   Now `prev` does. Its pose is evaluated live — with its own clock still
   running, so a comet's ribbons keep turning while they fade — and the drawn
   pose is `lerp(prev, next, k)` across silhouette, gaze, eyes and decor alike.

   Two things fall out of that. States chain with no gap: when one ends with
   another queued behind it, the next begins immediately and the crossfade is
   between the two rather than through the ball. And decor stops popping —
   outgoing dots and rings fade at `1 - k` while the incoming ones arrive at
   `k`.

   It runs on `clock`, the animation clock, like everything else the creature
   does — never `setTimeout`. See ADR 0004. */
/* ADR 0005: docs/decisions/0005-animation-catalogue.md */

const EXIT_MORPH = 0.38;

/* `prev.def === null` means "ordinary life". Keeping rest as a real prev
   rather than as the absence of one is what makes starting an animation a
   crossfade like any other: the first version left `prev` null when nothing
   had been playing, so every state begun from rest arrived in a single frame.
   Measured against the drawn silhouette, entering `thinking` from rest jumped
   154 px between two frames; the same entry now moves at most 4 px. */
const anim = {
  cur: null,      // { def, t0, until } — what is playing
  prev: null,     // { def, t0 } — what it is crossfading from; def null = rest
  morphT0: 0,     // when the current crossfade began
  morphDur: 0.4,
  queue: [],
  rot: null,      // last blended rotation, for continuity — see mixPoses
};

/* Stopping is a crossfade back to ordinary life, not a cut. It used to be a
   cut, and since every scripted beat that named no animation called it, an
   orbit begun a second earlier was killed mid-turn — silhouette and rings gone
   on one frame — by whatever the creature thought of next. */
function stopAnim() {
  anim.queue.length = 0;
  if (anim.cur) leaveAnim();
}

/* The hard version: nothing plays out, nothing is queued. Only for "leave it
   be", which is the one act that means stop, now. */
function cancelAnim() {
  anim.queue.length = 0;
  anim.cur = null;
  anim.prev = null;
  anim.rot = null;
}

function leaveAnim() {
  anim.prev = anim.cur || { def: null, t0: clock };
  anim.cur = null;
  anim.morphT0 = clock;
  anim.morphDur = EXIT_MORPH;
}

function playAnim(id, hold) {
  const def = STATE_BY_ID[id];
  if (!def) return;
  /* Large-field motion — the burst, the orbit, the comet, the travelling "!"
     — is exactly what `prefers-reduced-motion` is about, so it is skipped
     entirely rather than slowed down. The face still changes, so the state is
     still legible; it just does not fly across the element. */
  if (def.big && reducedMotion()) return;
  /* Whatever is showing becomes the thing we fade FROM — including a state
     that was itself only half-arrived. Its own clock keeps running. */
  anim.prev = anim.cur || { def: null, t0: clock };
  anim.cur = { def, t0: clock, until: clock + Math.max(def.minDuration ?? 0, hold ?? def.duration) };
  anim.morphT0 = clock;
  anim.morphDur = def.morph;
  if (def.blinkIn) blink(clock, 0.26);
}

/* The whole catalogue, back to back, in the order it was cut. */
function playAnimSequence(ids = SEQUENCE) {
  anim.queue = ids.slice();
  advanceAnim();
}

function advanceAnim() {
  const next = anim.queue.shift();
  if (next) playAnim(next);
  else leaveAnim();
}

/* Is anything animating — playing, or still fading out? */
function animBusy() {
  return anim.cur !== null || anim.prev !== null;
}

/* One state's contribution, resolved against ordinary life. `baseBody` and
   `baseFace` mean "that channel is not mine", so the body you picked and the
   expression the mood chose come through untouched. */
function poseOfState(def, local, rest) {
  const p = def.pose(local);
  return {
    sil: def.baseBody ? rest.sil : p.sil,
    gaze: def.baseFace ? rest.gaze : p.gaze,
    split: def.baseFace ? rest.split : p.split,
    eyes: def.baseFace ? rest.eyes : p.eyes,
    eyeAlpha: p.eyeAlpha,
    dots: p.dots, arcs: p.arcs, notif: p.notif, dotsBehind: p.dotsBehind,
  };
}

const restPose = (rest) => ({
  sil: rest.sil, gaze: rest.gaze, split: rest.split, eyes: rest.eyes,
  eyeAlpha: 1, dots: [], arcs: [], notif: null, dotsBehind: false,
});

/* The drawn pose, or null when nothing is animating and the loop can take its
   cheap path. This advances the state machine, so call it exactly once a
   frame. */
function animPose(rest) {
  if (anim.cur && clock >= anim.cur.until) {
    if (anim.queue.length) advanceAnim();
    else leaveAnim();
  }
  if (!anim.cur && !anim.prev) { anim.rot = null; return null; }

  const k = anim.morphDur > 0 ? clamp((clock - anim.morphT0) / anim.morphDur) : 1;
  /* Drop the outgoing state BEFORE interpolating on the final frame, so a
     settled pose is exactly the incoming pose rather than a lerp that happens
     to land on it. The expression crossfade had this same bug, and there it
     showed up as 0.17000000000000004 where 0.17 was meant. */
  if (k >= 1) anim.prev = null;
  if (!anim.cur && !anim.prev) { anim.rot = null; return null; }

  const next = anim.cur ? poseOfState(anim.cur.def, clock - anim.cur.t0, rest) : restPose(rest);
  if (!anim.prev) { anim.rot = next.sil.rot; return next; }
  const from = anim.prev.def
    ? poseOfState(anim.prev.def, clock - anim.prev.t0, rest)
    : restPose(rest);
  return mixPoses(from, next, EASE.inOutCubic(k));
}

/* Nearest way round from a reference angle. */
function unwrapTo(ref, x) {
  let d = x - ref;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  return ref + d;
}

function mixPoses(a, b, k) {
  /* Rotation is unwrapped toward what was drawn LAST FRAME, not toward the
     other silhouette. `orbit` spins continuously, so once its angle passed
     -180deg the shortest path from a still shape flipped sign and the blend
     reversed direction mid-crossfade — a 26 px jump, measured. Anchoring both
     ends to the previous output keeps the drawn rotation continuous whatever
     the two ends are doing. */
  const ref = anim.rot === null ? b.sil.rot : anim.rot;
  const sil = blendSil(a.sil, b.sil, k);
  sil.rot = lerp(unwrapTo(ref, a.sil.rot), unwrapTo(ref, b.sil.rot), k);
  anim.rot = sil.rot;
  return {
    sil,
    gaze: {
      yaw: lerp(a.gaze.yaw, b.gaze.yaw, k),
      pitch: lerp(a.gaze.pitch, b.gaze.pitch, k),
      roll: lerp(a.gaze.roll, b.gaze.roll, k),
    },
    split: lerp(a.split, b.split, k),
    eyes: [lerpEye(a.eyes[0], b.eyes[0], k), lerpEye(a.eyes[1], b.eyes[1], k)],
    eyeAlpha: lerp(a.eyeAlpha, b.eyeAlpha, k),
    /* Decor is not interpolated — an outgoing ring and an incoming dot are not
       two values of one thing — so both are drawn and their opacities are
       crossfaded instead. */
    dots: fadeDecor(a.dots, 1 - k).concat(fadeDecor(b.dots, k)),
    arcs: fadeDecor(a.arcs, 1 - k).concat(fadeDecor(b.arcs, k)),
    notif: pickNotif(a.notif, 1 - k, b.notif, k),
    dotsBehind: k < 0.5 ? a.dotsBehind : b.dotsBehind,
  };
}

const fadeDecor = (list, k) =>
  (k <= 0.001 ? [] : list.map((d) => ({ ...d, opacity: d.opacity * k })));

/* Only one pip can be notched out of the body at a time — the mask is a single
   circle — so the fading one keeps the notch until the arriving one is
   larger. */
function pickNotif(a, ka, b, kb) {
  const A = a ? { ...a, r: a.r * ka, notch: a.notch * ka } : null;
  const B = b ? { ...b, r: b.r * kb, notch: b.notch * kb } : null;
  if (!A) return B;
  if (!B) return A;
  return B.r >= A.r ? B : A;
}

/* ── UNPROMPTED ───────────────────────────────────────────────────────────
   He plays these to himself, rarely. The weights are lopsided: a wink or a
   thought is a small thing that can happen every half-minute without wearing
   out, while collapsing into a comet is not. None of them leaves a mood trace
   — an animation is something he DOES, not something that happens to him. */
const IDLE_ANIMS = [
  [11, "wink"], [9, "thinking"], [8, "wide"], [6, "notify"], [5, "exclaim"],
  [4, "alert"], [4, "egg"], [4, "hexagon"], [4, "play"], [3, "sleep"],
  [3, "comet"], [3, "burst"], [2, "orbit"],
];
let nextAnimAt = 24;

function maybeIdleAnim(t) {
  if (t < nextAnimAt) return;
  nextAnimAt = t + rnd(26, 62);
  if (animBusy() || mote.mode === "asleep" || t < mote.episodeUntil) return;
  if (mote.hold && t < mote.hold.until) return;
  let r = Math.random() * IDLE_ANIMS.reduce((n, [w]) => n + w, 0);
  for (const [w, id] of IDLE_ANIMS) if ((r -= w) <= 0) return playAnim(id);
}

/* ── DRIVING IT FROM A REAL STREAM ────────────────────────────────────────
   The agent surface is a set of states; a model stream is a sequence of
   events. This translates one into the other, so an integration is
   `for await (const e of stream) avatar.event(e)` and nothing else.

   It is written against the Anthropic Messages streaming shape —
   `message_start`, `content_block_start`, `content_block_delta`,
   `content_block_stop`, `message_delta`, `message_stop`, `error` — because
   that is the stream this was built for. Anything with the same skeleton maps
   the same way; the whole translation is the table below and it is thirty
   lines.

   Writing this is what exposed three things the hand-driven demo never could,
   all of which are fixed in the layer below rather than here:

     · a stream calls the same state hundreds of times. `thinking` arrives on
       every thinking delta. So repeating a state while its episode is still
       running is now a no-op — otherwise the creature restarts its script on
       every token and never gets past the first beat.
     · text arrives a few characters at a time, and a face per token is a
       seizure. Speech is therefore batched to SENTENCE boundaries here, in
       the adapter, where the token stream actually is.
     · a tool call has no duration in the event stream — `content_block_start`
       says it began and nothing says it ended, because the result comes back
       in the NEXT request. So `tool()` waits, and `toolResult()` ends it.
       Without that the creature looks up from a tool call after a fixed 2.4s
       whether or not the tool has returned, which is the tell that it is
       animation rather than status. */
/* ADR 0007: docs/decisions/0007-stream-adapter.md */

/* Sentence enough to speak. Kept deliberately dumb — the point is a natural
   pause, not correct segmentation, and a wrong split costs nothing. */
const SENTENCE_END = /[.!?…]["')\]]?\s$|\n\s*$/;
const MIN_SPEAK = 12;   // don't stop for "Hi." on its own

function makeStreamDriver(api) {
  let buffer = "";
  let blockKind = null;   // what the open content block is
  let toolName = null;
  let sawStop = false;

  const flush = (force) => {
    const text = buffer.trim();
    if (!text) return;
    if (!force && text.length < MIN_SPEAK) return;
    buffer = "";
    /* ~55ms a character, floored — long enough to read, and it is also how
       long the creature holds the face. */
    api.speaking(text, Math.min(9000, Math.max(1600, text.length * 55)));
  };

  return {
    /* One event in, whatever it implies out. Unknown event types are ignored
       rather than thrown on: a stream that grows a new event type should not
       take the avatar down with it. */
    event(e) {
      if (!e || typeof e.type !== "string") return api;
      switch (e.type) {
        case "message_start":
          buffer = ""; sawStop = false;
          api.thinking();
          break;

        case "content_block_start": {
          const block = e.content_block || {};
          blockKind = block.type;
          if (block.type === "thinking") api.thinking();
          else if (block.type === "tool_use") {
            toolName = block.name || null;
            api.tool(toolName);
          }
          break;
        }

        case "content_block_delta": {
          const d = e.delta || {};
          if (d.type === "text_delta") {
            buffer += d.text || "";
            if (SENTENCE_END.test(buffer)) flush(false);
          }
          /* `thinking_delta` and `input_json_delta` deliberately do nothing.
             The creature is already thinking or already on the tool, and
             re-asserting it every delta is the thrash this adapter exists to
             prevent. */
          break;
        }

        case "content_block_stop":
          if (blockKind === "text") flush(true);
          blockKind = null;
          break;

        case "message_delta": {
          const reason = (e.delta || {}).stop_reason;
          if (!reason) break;
          sawStop = true;
          /* Say the last sentence BEFORE reacting to the turn ending. The
             final chunk usually has no trailing whitespace, so it does not
             flush on its own — without this the leftover text spoke after
             `done()` and overwrote the beat that says the turn landed. */
          flush(true);
          if (reason === "tool_use") break;               // still waiting on you
          else if (reason === "end_turn" || reason === "stop_sequence") api.done();
          else if (reason === "max_tokens") api.interrupted();
          else if (reason === "refusal") {
            /* Not a failure of the agent — it declined. Sheepish, not
               alarmed, so `needsInput` rather than `error`. */
            api.needsInput();
          } else if (reason === "pause_turn") api.thinking();
          break;
        }

        case "message_stop":
          flush(true);
          if (!sawStop) api.done();
          break;

        case "error":
          flush(true);
          api.error((e.error && e.error.message) || null);
          break;
      }
      return api;
    },

    /* The result of a tool call came back. Ends the wait started by the
       `tool_use` block — nothing in the stream itself can. */
    toolResult(ok = true) {
      toolName = null;
      api.toolResult(ok);
      return api;
    },

    /* The whole stream, for the common case. Works with anything async
       iterable: the SDK's `client.messages.stream(...)`, a `ReadableStream`
       of parsed events, an array in a test. */
    async run(stream) {
      for await (const e of stream) this.event(e);
      return api;
    },
  };
}

/* ── THE AGENT SURFACE ────────────────────────────────────────────────────
   Everything below this line is the creature. Everything above it is a page.
   This is the seam, and it exists so that Mote can be dropped into somebody
   else's agent UI without bringing a demo with it.

   The API is deliberately written in the vocabulary of an agent's turn —
   `thinking`, `tool`, `speaking`, `needsInput`, `error` — and not in the
   vocabulary of the creature. An integrator has an agent, not a mood: asking
   them which of seventeen faces means "waiting on a tool call" is asking them
   to design the avatar, which is the part they came here not to do.

   So the mapping from agent state to choreography lives HERE, once, hardwired,
   and it is the substance of the thing. Each entry is a scripted episode in
   the sense of ADR 0004 — a written face order, optionally naming an animation
   from the catalogue — and the table is the specification.

   What the creature does BETWEEN calls is its own business: it looks around,
   drifts on slow mood weather and occasionally plays something to itself. An
   agent that never calls anything still has a face worth looking at, which is
   the entire argument for an avatar over a spinner. */
/* ADR 0006: docs/decisions/0006-embeddable-agent-avatar.md */

const AGENT_ACTS = {
  /* Nothing is happening. Not a state so much as the absence of one — this
     hands the creature back to itself. */
  idle: () => { stopAnim(); epoch++; mote.awaitingTool = false; mote.hold = null; mote.episodeUntil = -9; },

  /* You are typing, or the mic is open. It attends to you and holds it. */
  listening: () => play([
    { face: "attentive", hold: 3.2, kind: "listen", look: ["viewer", 2.6] },
  ]),

  /* The model is working. The three dots ARE this state — it is the one piece
     of the catalogue that reads as computation to everybody. */
  thinking: () => play([
    { face: "neutral", hold: 0.5, kind: "think", think: 3.0 },
    { face: "neutral", hold: 2.6, anim: "thinking" },
    { face: "curious", hold: 1.6 },
  ]),

  /* A tool call: the same work, but with something outside itself involved,
     so it looks away while it waits.

     This one WAITS. A tool call has no duration in a model stream — the event
     says it began and nothing says it ended, because the result comes back in
     the next request — so the script re-arms itself until `toolResult` is
     called. A creature that looks up after a fixed 2.4s whether or not the
     tool returned is the tell that it is animation rather than status. */
  tool: (name) => {
    mote.awaitingTool = true;
    const beat = () => {
      play([
        { face: "curious", hold: 0.8, kind: "tool", look: ["away", 2.2],
          say: name ? [`${name}…`, 1400] : undefined },
        { face: "neutral", hold: 2.6, anim: "thinking" },
      ]);
      later(3.4, () => { if (mote.awaitingTool) beat(); });
    };
    beat();
  },

  /* The result came back. `ok: false` is a failed tool, which is not the same
     event as the agent failing — it looks put out, not alarmed. */
  toolResult: (ok = true) => {
    mote.awaitingTool = false;
    play(ok
      ? [{ face: "attentive", hold: 1.8 }]
      : [{ face: "unimpressed", hold: 1.6, blink: true }, { face: "attentive", hold: 1.4 }]);
  },

  /* Streaming a reply. The hold is long because speech is long; call it again
     to extend, which is what a stream does anyway. */
  speaking: (text, ms) => play([
    { face: "attentive", hold: Math.max(1.4, (ms || 2400) / 1000),
      kind: "speak", look: ["viewer", 1.8],
      say: text ? [text, ms || 2400] : undefined },
  ]),

  /* The turn landed. Pleased, then back to attending — pleased-and-stays-
     pleased reads as smug within about three turns. */
  done: () => play([
    { face: "happy", hold: 1.6, kind: "done", trace: true, blink: true },
    { face: "attentive", hold: 2.0 },
  ]),

  /* A long job finished. Worth more than `done`, and rare enough to stay
     worth it. */
  shipped: () => play([
    { face: "excited", hold: 1.6, kind: "ship", trace: true, blink: true },
    { face: "proud", hold: 2.6, look: ["viewer", 1.6] },
  ]),

  /* It needs you: a clarifying question, or permission to act. The
     exclamation mark is the whole point — it is legible across a room. */
  needsInput: (question) => play([
    { face: "attentive", hold: 2.0, kind: "ask", anim: "exclaim" },
    { face: "curious", hold: 2.6, look: ["viewer", 2.2],
      say: question ? [question, 2400] : undefined },
  ]),

  /* Something arrived while you were elsewhere. */
  notify: () => play([
    { face: "surprised", hold: 2.2, kind: "notify", anim: "notify" },
    { face: "attentive", hold: 1.6 },
  ]),

  /* It failed. Alarmed, then it owns it — the sequence matters more than
     either face: startled-then-sheepish reads as a mistake, sad alone reads
     as a sulk. */
  error: (message) => play([
    { face: "scared", hold: 2.4, kind: "error", trace: true, anim: "alert" },
    { face: "surprised", hold: 1.0, blink: true },
    { face: "shy", hold: 2.8, look: ["away", 2.4],
      say: message ? [message, 2200] : undefined },
  ]),

  /* You stopped it mid-flight. */
  interrupted: () => play([
    { face: "surprised", hold: 2.6, kind: "stop", anim: "burst" },
    { face: "attentive", hold: 1.6, look: ["viewer", 1.4] },
  ]),

  /* The session has gone quiet. Not a script: this is how the creature is
     when nobody has been here for a while, so it is expressed as absence. */
  asleep: () => {
    mote.awaitingTool = false;
    epoch++; stopAnim();
    mote.hold = null; mote.episodeUntil = -9;
    mote.lastInput = clock - 52;
    mote.cursor.has = false;
  },
};

/* Mount a creature into an element and get back a handle.

   ONE PER PAGE. The creature's state — mood, attention, the animation player,
   the worn expression — is module-level, deliberately: it is one animal, and
   threading an instance through every function bought nothing the demo or an
   agent UI needed. Mounting twice replaces the first. If you ever need two,
   that is a real refactor and not a flag. */
let mounted = null;

function mountMote(host, opts = {}) {
  if (!host) throw new Error("mote: mount needs an element");
  if (mounted) mounted.destroy();

  const stage = makeStage(host, { decorative: opts.decorative === true });
  let running = false;
  let raf = 0;
  let last = 0;

  const api = {
    el: host,

    /* Appearance and character. The name is not decoration: it seeds
       temperament, so the same name is always the same animal. */
    setSkin(next = {}) {
      if (next.body) mote.body = BODY_BY_ID[next.body] || mote.body;
      if (next.paint) mote.paint = next.paint;
      if (next.name) { mote.name = next.name; mote.temper = temperamentFor(next.name); }
      return api;
    },

    /* Where its attention goes. `viewer` is a fixation on where the pointer
       was when you called, NOT a follow — continuous tracking reads as a
       targeting reticle rather than as a creature. */
    look(mode = "about", seconds = 1.4) { look(mode, seconds); return api; },

    /* What it currently is. Enough to save and restore one. */
    skin: () => ({ body: mote.body.id, paint: mote.paint, name: mote.name }),

    /* Schedule on the ANIMATION clock, not the wall clock. Exposed because an
       integrator chaining two calls — listen, then think a beat later — would
       otherwise reach for setTimeout, which fires against a frozen creature
       when the tab is hidden and takes the sequence apart. See ADR 0004. */
    after(seconds, fn) { later(seconds, fn); return api; },
    say(text, ms = 1800) { say(text, ms); return api; },

    /* One of the fourteen, by id, for anyone who wants the vocabulary
       directly. */
    animate(id, hold) { playAnim(id, hold); return api; },
    animations: () => STATES.map((s) => ({ id: s.id, label: s.label })),
    bodies: () => BODIES.map((b) => ({ id: b.id, label: b.label })),
    palette: () => PAINTS.map(([label, hex]) => ({ label, hex })),

    /* Where the creature's own voice goes, if anywhere. */
    onSay(fn) { mote.onSay = fn; return api; },
    onFace(fn) { mote.onFace = fn; return api; },

    /* A pointer position, in -1..1 across the element, for the rare moments
       it chooses to glance over. Optional: it has a life without one. */
    pointer(x, y) {
      mote.cursor = { x: clamp(x, -1.6, 1.6), y: clamp(y, -1.6, 1.6), has: true };
      mote.lastInput = clock;
      /* Movement is what wakes it. Anything else — a call, a tick — leaves a
         sleeping creature asleep, which is the point of it having slept. */
      if (mote.mode === "asleep") {
        look("viewer", 1.3);
        mote.valence.push(0.25); mote.arousal.push(0.85); mote.dominance.push(0.2);
        blink(clock, 0.24);
      }
      return api;
    },
    poke() {
      mote.lastInput = clock;
      react("surprised", 1.0, { kind: "poke", blink: true, power: 0.8 });
      look("viewer", 1.2);
      return api;
    },

    /* Drive it yourself — pass a `performance.now()`-style millisecond stamp.
       `mount` starts its own loop unless you asked for `manual`. */
    tick(now) { step(now); return api; },

    start() {
      if (running) return api;
      running = true;
      last = performance.now() / 1000;
      const loop = (now) => { if (!running) return; step(now); raf = requestAnimationFrame(loop); };
      raf = requestAnimationFrame(loop);
      return api;
    },
    stop() { running = false; cancelAnimationFrame(raf); return api; },
    /* Put the creature back to how it was found. The state is module-level,
       so without this a remount inherits the previous avatar's mood, its
       attention mode and whatever it was in the middle of playing — which
       looks like a bug the first time an app remounts on a route change. */
    destroy() {
      api.stop();
      cancelAnim();
      resetMote();
      clearHost(host);
      if (mounted === api) mounted = null;
    },
  };

  /* The agent surface, bound onto the handle. Generated from the table so the
     table stays the only place a state is defined.

     Repeating a state while its episode is still running is a NO-OP, and that
     is not an optimisation. A model stream calls `thinking()` on every
     thinking delta — hundreds of times a turn — and without this the script
     restarts on every token and the creature never reaches its second beat.
     Arguments are part of the comparison, so `tool("search")` twice is one
     call but `tool("read")` after it is a new one. `speaking` is exempt: the
     text differs every time and saying the next sentence is the point. */
  /* ADR 0007: the no-op-on-repeat rule and `state()` exist because a model
     stream calls the same state on every delta.
     docs/decisions/0007-stream-adapter.md */
  let lastCall = "";
  for (const [name, fn] of Object.entries(AGENT_ACTS)) {
    api[name] = (...args) => {
      const sig = name + "|" + args.map((a) => String(a)).join("|");
      if (name !== "speaking" && sig === lastCall && clock < mote.episodeUntil) return api;
      lastCall = sig;
      mote.lastInput = clock;
      fn(...args);
      return api;
    };
  }

  /* Which state it was last put into, and whether that episode is still
     playing. Enough to drive a status line without tracking it yourself. */
  api.state = () => ({
    name: lastCall.split("|")[0] || null,
    playing: clock < mote.episodeUntil,
    awaitingTool: mote.awaitingTool === true,
  });

  /* Events straight from a model stream. See `embed/stream.js`. */
  const driver = makeStreamDriver(api);
  api.event = (e) => driver.event(e);
  api.runStream = (stream) => driver.run(stream);

  function step(now) {
    const nowS = now / 1000;
    const dt = clamp(nowS - last, 0, 0.05);
    last = nowS;
    clock += dt;
    drawFrame(stage, clock, dt);
  }

  api.setSkin(opts);
  drawFrame(stage, clock, 0);
  mounted = api;
  if (!opts.manual) api.start();
  return api;
}

/* ── ONE FRAME ────────────────────────────────────────────────────────────
   Read the creature's state and draw it. Decides nothing that is not about
   drawing: what it wants, how it feels and what it is playing were all
   settled before this ran. */
function drawFrame(stage, t, dt) {
  runPending();
  direct(t);
  mote.mood.decay(dt);
  if (mote.hold) {
    if (t < mote.hold.until) {
      mote.valence.home = mote.hold.v;
      mote.arousal.home = mote.hold.a;
      mote.dominance.home = mote.hold.d;
    } else mote.hold = null;
  }
  mote.valence.step(dt);
  mote.arousal.step(dt);
  mote.dominance.step(dt);
  const v = clamp(mote.valence.x, -1, 1);
  const a = clamp(mote.arousal.x, 0, 1);
  const d = clamp(mote.dominance.x, -1, 1);

  mote.gaze.step(t, dt, a, (amp) => blink(t, 0.1 + amp * 0.0022));

  /* Spontaneous blinks: an alert creature blinks less, a drowsy one blinks
     slowly and often. */
  if (t > mote.nextBlink) {
    blink(t, lerp(0.30, 0.11, a));
    mote.nextBlink = t + lerp(1.6, 5.2, a) * rnd(0.6, 1.5);
  }
  const bk = (t - mote.blinkAt) / mote.blinkDur;
  let lidClose = 1;
  if (bk >= 0 && bk <= 1) lidClose = bk < 0.42 ? 1 - bk / 0.42 : (bk - 0.42) / 0.58;

  /* While a feeling is running, it wears the face that feeling NAMED. Picking
     the nearest face to the live mood instead meant it wore every expression
     the trajectory happened to pass over on the way. */
  const held = mote.hold && t < mote.hold.until ? mote.hold.face : null;
  const { mix, id: faceId, settled } = expressionFor(t, v, a, d, held);
  maybeIdleAnim(t);

  /* The body never changes size. No breath, no speech swell, no reaction
     kick — every one of those was a pulse, and pulses on a shape this simple
     read as a glitch rather than as life. What is left is a small lean in the
     direction it is looking, which only moves when its attention does. */
  const gx = Math.sin(rad(mote.gaze.yaw)), gy = -Math.sin(rad(mote.gaze.pitch));

  const rest = {
    sil: bodySil(mote.body),
    gaze: gazeOf(mix, mote.gaze),
    split: mix.split, eyes: mix.eyes,
  };
  /* One call a frame: it advances the animation state machine as well as
     answering it. Null means nothing is playing and nothing is still fading
     out, and the renderer can use the cached body path. */
  const pose = animPose(rest) || rest;

  drawStage(stage, {
    body: pose === rest ? mote.body : undefined,
    sil: pose === rest ? undefined : pose.sil,
    paint: mote.paint,
    x: gx * 7, y: gy * 5,
    gaze: pose.gaze, split: pose.split, eyes: pose.eyes,
    eyeAlpha: pose.eyeAlpha, blinkLid: lidClose,
    dots: pose.dots, arcs: pose.arcs, notif: pose.notif, dotsBehind: pose.dotsBehind,
  });

  if (mote.onFace) mote.onFace(faceId, settled, MOODLINE[faceId]);
}

/* The public object. In the bundled build this is what `Mote` is; the demo on
   this page uses the very same thing, which is the only way to know the seam
   holds. */
const Mote = {
  mount: mountMote,
  faces: () => FACES.map((f) => f.id),
  states: () => STATES.map((s) => ({ id: s.id, label: s.label })),
  bodies: () => BODIES.map((b) => ({ id: b.id, label: b.label })),
  palette: () => PAINTS.map(([label, hex]) => ({ label, hex })),
  describe: (name) => temperamentFor(name),
};

/* ── THE DEMO PAGE ────────────────────────────────────────────────────────
   From here down, nothing is the creature: this is one integrator among
   others, and it goes through `Mote.mount` exactly like anybody else would.

   That is deliberate. A demo that reaches past the public API always ends up
   proving the API works when it does not — the page looks right and the first
   person to embed it finds the hole. Everything this page does, it does with
   the handle below. */
/* ADR 0006: this page goes through Mote.mount like anybody else would.
   docs/decisions/0006-embeddable-agent-avatar.md */
const field = document.getElementById("field");
const speechEl = document.getElementById("speech");
const moodEl = document.getElementById("mood");

const avatar = Mote.mount(field, { manual: true });
let shownMood = "";

avatar.onSay((text) => {
  speechEl.textContent = text;
  speechEl.classList.add("on");
});
avatar.onFace((id, settled, line) => {
  if (line !== shownMood && settled) { shownMood = line; moodEl.textContent = line; }
});

/* One loop for the page: the maker preview while you are still choosing, the
   creature once it exists. The avatar was mounted `manual` for exactly this —
   an embedder who has no second thing to draw just lets it run its own. */
function frame(now) {
  if (makeView.classList.contains("on")) drawPreview(now / 1000);
  else {
    avatar.tick(now);
    if (clock > mote.speakUntil && speechEl.classList.contains("on")) {
      speechEl.classList.remove("on");
    }
  }
  requestAnimationFrame(frame);
}

/* ── you, from its side ───────────────────────────────────────────────────
   It knows where you are and does not follow you. The pointer records a
   position for the rare moments it chooses to look over, and nothing else
   about it reaches the creature. */
window.addEventListener("pointermove", (e) => {
  const r = field.getBoundingClientRect();
  avatar.pointer(
    ((e.clientX - r.left) / r.width - 0.5) * 2,
    ((e.clientY - r.top) / r.height - 0.5) * 2,
  );
});

field.addEventListener("pointerdown", () => avatar.poke());

/* ── THE DECK ─────────────────────────────────────────────────────────────
   Nine things an agent does, driven entirely through the PUBLIC API — these
   are `avatar.thinking()`, `avatar.tool("search")`, `avatar.error(...)` and
   nothing else. That is the point of the page: if a button here needs to
   reach past `Mote.mount` to look right, the API is short of something an
   integrator will need on their first afternoon.

   Nothing here is an agent. There is no model, no tool call and no work — the
   whole point is the CREATURE, and what an agent's turn gives it is a reason
   to wear each face in an order that means something. A face sequence with a
   cause reads as a mind; the same sequence on a button marked "sad" reads as
   a menu. */
/* ADR 0004: the face order behind each of these is the specification, and it
   lives in the act table, not here. docs/decisions/0004-scripted-episodes.md
   ADR 0006: the demo is an integrator, not an insider.
   docs/decisions/0006-embeddable-agent-avatar.md
   ADR 0005: the animation row below plays the ported catalogue.
   docs/decisions/0005-animation-catalogue.md */
const ACTS = [
  ["Give it a task", () => { avatar.listening(); avatar.after(1.0, () => avatar.thinking()); }],
  ["Call a tool", () => avatar.tool("search")],
  ["Stream a reply", () => avatar.speaking("here is what I found.", 2600)],
  ["Finish the turn", () => avatar.done()],
  ["Ask for permission", () => avatar.needsInput("may I?")],
  ["Hit an error", () => avatar.error("...that was me.")],
  ["Interrupt it", () => avatar.interrupted()],
  ["Background result", () => avatar.notify()],
  ["Ship the big one", () => avatar.shipped()],
  ["Leave it be", () => avatar.asleep()],
];
const acts = document.getElementById("acts");
ACTS.forEach(([label, fn]) => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = label;
  b.addEventListener("click", fn);
  acts.appendChild(b);
});

/* ── making one ───────────────────────────────────────────────────────────  */
/* ── the catalogue, to look at ────────────────────────────────────────────
   Fourteen buttons and one that plays the lot in the order the reference
   video cut them. These are not reactions: they carry no mood trace and no
   speech, they just play. Starting one cancels whatever else was playing,
   which is why they are all `playAnim` and never queued. */
/* ADR 0005: docs/decisions/0005-animation-catalogue.md */
const animsEl = document.getElementById("anims");
avatar.animations().forEach((s) => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = s.label;
  b.addEventListener("click", () => avatar.animate(s.id));
  animsEl.appendChild(b);
});
const allBtn = document.createElement("button");
allBtn.type = "button"; allBtn.textContent = "Play them all";
allBtn.addEventListener("click", () => playAnimSequence());
animsEl.appendChild(allBtn);

const makeView = document.getElementById("make");
const liveView = document.getElementById("live");
const previewHost = document.getElementById("preview");
const nameInput = document.getElementById("name");
const givenEl = document.getElementById("given");

const draft = { body: BODIES[0], paint: PAINTS[0][1] };
const preview = makeStage(previewHost, { decorative: true });

/* The preview and every tile are the real renderer holding a still pose, so
   what you pick is exactly what you get. */
const REST_FACE = poseOf(FACES.find((f) => f.id === "attentive"));
const STILL = {
  x: 0, y: 0, blinkLid: 1,
  gaze: gazeOf(REST_FACE, { yaw: 0, pitch: 0 }),
  split: REST_FACE.split, eyes: REST_FACE.eyes,
};
/* The preview breathes the same engine, cut right down: it looks about and
   it blinks, and nothing else. No moods, no reactions, no drifting weather —
   you are choosing a body here, not meeting him yet. But a specimen frozen
   dead on the slab is a poor advertisement for a creature, so he gets eyes
   that work. */
const sprout = { gaze: new Gaze(), blinkAt: -9, blinkDur: 0.16, nextBlink: 1.4, nextPlace: 0 };

function drawPreview(t) {
  if (t === undefined) { drawStage(preview, { ...STILL, body: draft.body, paint: draft.paint }); return; }

  if (t > sprout.nextPlace) {
    sprout.nextPlace = t + rnd(1.1, 3.0);
    const q = PLACES[Math.floor(Math.random() * PLACES.length)];
    sprout.gaze.aim(q.y * 0.7 + rnd(-6, 6), q.p * 0.7 + rnd(-4, 4));
  }
  sprout.gaze.step(t, 1 / 60, 0.5, () => { sprout.blinkAt = t; sprout.blinkDur = 0.15; });

  if (t > sprout.nextBlink) {
    sprout.blinkAt = t; sprout.blinkDur = 0.2;
    sprout.nextBlink = t + rnd(2.2, 5.4);
  }
  const bk = (t - sprout.blinkAt) / sprout.blinkDur;
  let lid = 1;
  if (bk >= 0 && bk <= 1) lid = bk < 0.42 ? 1 - bk / 0.42 : (bk - 0.42) / 0.58;

  const gx = Math.sin(rad(sprout.gaze.yaw)), gy = -Math.sin(rad(sprout.gaze.pitch));
  drawStage(preview, {
    ...STILL, body: draft.body, paint: draft.paint,
    x: gx * 7, y: gy * 5,
    gaze: gazeOf(REST_FACE, sprout.gaze),
    blinkLid: lid,
  });
}

const shapesEl = document.getElementById("shapes");
const tiles = BODIES.map((b) => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.setAttribute("aria-label", b.label);
  btn.title = b.label;
  btn.setAttribute("aria-pressed", String(b === draft.body));
  const st = makeStage(btn, { decorative: true });
  const paint = () => drawStage(st, { ...STILL, body: b, paint: draft.paint });
  paint();
  btn.addEventListener("click", () => {
    draft.body = b;
    tiles.forEach((tb) => tb.btn.setAttribute("aria-pressed", String(tb.body === b)));
    drawPreview();
  });
  shapesEl.appendChild(btn);
  return { btn, body: b, paint };
});

const coloursEl = document.getElementById("colours");
const dots = PAINTS.map(([name, hex]) => {
  const btn = document.createElement("button");
  btn.type = "button"; btn.style.background = hex;
  btn.title = name; btn.setAttribute("aria-label", name);
  btn.setAttribute("aria-pressed", String(hex === draft.paint));
  btn.addEventListener("click", () => {
    draft.paint = hex;
    dots.forEach((d) => d.setAttribute("aria-pressed", String(d.style.background === btn.style.background)));
    tiles.forEach((tb) => tb.paint());
    drawPreview();
  });
  coloursEl.appendChild(btn);
  return btn;
});

drawPreview();

const backBtn = document.getElementById("back");
const hatchBtn = document.getElementById("hatch");
let hasHatched = false;

function openMaker() {
  liveView.classList.remove("on");
  makeView.classList.add("on");
  hatchBtn.textContent = hasHatched ? "Save changes" : "Bring it to life";
  backBtn.hidden = !hasHatched;
  drawPreview();
}

/* Say who he will be, in a sentence, before you commit to him. Drawn from the
   same numbers that actually drive him — this is a description, not flavour
   text bolted on the side. */
const TRAITS = [
  (T) => (T.baseA > 0.56 ? "lively" : T.baseA < 0.44 ? "placid" : null),
  (T) => (T.baseV > 0.26 ? "sunny" : T.baseV < 0.04 ? "solemn" : null),
  (T) => (T.baseD > 0.22 ? "bold" : T.baseD < -0.14 ? "timid" : null),
  (T) => (T.volatility > 1.18 ? "excitable" : T.volatility < 0.82 ? "even-tempered" : null),
  (T) => (T.curiosity > 1.2 ? "endlessly curious" : T.curiosity < 0.78 ? "incurious" : null),
  (T) => (T.sociability > 1.35 ? "fond of company" : T.sociability < 0.6 ? "private" : null),
  (T) => (T.moodGain > 1.3 ? "quick to take things to heart" : null),
];
const temperEl = document.getElementById("temper");

function describe(name) {
  const T = temperamentFor(name || "Mote");
  const traits = TRAITS.map((f) => f(T)).filter(Boolean).slice(0, 3);
  const who = (name || "").trim() || "It";
  if (!traits.length) return `${who} will be a fairly ordinary sort.`;
  const list = traits.length === 1 ? traits[0]
    : traits.slice(0, -1).join(", ") + " and " + traits[traits.length - 1];
  return `${who} will be ${list}.`;
}
const refreshTemper = () => { temperEl.textContent = describe(nameInput.value); };
nameInput.addEventListener("input", refreshTemper);
refreshTemper();

function hatch() {
  const first = !hasHatched;
  hasHatched = true;
  const name = (nameInput.value || "").trim() || "Mote";
  avatar.setSkin({ body: draft.body.id, paint: draft.paint, name });
  givenEl.textContent = name;
  document.title = name;
  makeView.classList.remove("on");
  liveView.classList.add("on");
  try { localStorage.setItem("mote", JSON.stringify({ body: draft.body.id, paint: draft.paint, name })); } catch {}

  if (!first) return;   // coming back from an edit: do not re-introduce it

  /* It was already busy before you arrived; it notices you a beat later. */
  avatar.look("about", 1.9);
  avatar.after(1.9, () => avatar.notify());
}
document.getElementById("hatch").addEventListener("click", hatch);
nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") hatch(); });

document.getElementById("change").addEventListener("click", openMaker);
backBtn.addEventListener("click", () => {
  /* Abandoning an edit puts back what he actually is, not the half-made draft. */
  const was = avatar.skin();
  draft.body = BODY_BY_ID[was.body]; draft.paint = was.paint;
  nameInput.value = was.name;
  syncPickers();
  makeView.classList.remove("on");
  liveView.classList.add("on");
});

function syncPickers() {
  tiles.forEach((tb) => { tb.btn.setAttribute("aria-pressed", String(tb.body === draft.body)); tb.paint(); });
  dots.forEach((d, i) => d.setAttribute("aria-pressed", String(PAINTS[i][1] === draft.paint)));
  refreshTemper();
  drawPreview();
}

/* Somebody who already made one should meet it, not the form. */
try {
  const saved = JSON.parse(localStorage.getItem("mote") || "null");
  if (saved && BODY_BY_ID[saved.body]) {
    draft.body = BODY_BY_ID[saved.body];
    draft.paint = saved.paint;
    nameInput.value = saved.name || "";
    syncPickers();
    hatch();
  }
} catch {}

requestAnimationFrame(frame);

</script>
